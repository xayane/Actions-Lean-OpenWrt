name: Build x64 lean for MJ R2Max

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      force-build:
        description: "Build x64 lean for MJ R2Max"
        required: false
        default: "false"
  # Uncomment the following to run regularly. Note that the cron expression here does not contain seconds.
  schedule:
    - cron: '30 1 * * *'

env:
  REPO_NAME: lean-x64-Openwrt
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: MJ-x86_64_mini.config
  DIY_P1_SH: MJ-diy-part1.sh
  DIY_P2_SH: MJ-diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

# 最小权限: 只读仓库即可编译, 发布 release 需要 contents: write
permissions:
  contents: write

# 同一分支只跑一个, 避免定时任务与手工触发抢 runner、互相覆盖 release 标签
concurrency:
  group: mj-firmware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check for source code updates
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache-hash.outputs.cache-hit }}

    steps:
      - name: Get Commit Hash
        id: get-hash
        run: |
          git clone --depth 1 --branch $REPO_BRANCH --single-branch $REPO_URL ./
          echo "commit-hash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Compare Commit Hash
        id: cache-hash
        uses: actions/cache@main
        with:
          path: .${{ env.REPO_NAME }}-${{ env.REPO_BRANCH }}-commit-hash
          key: HEAD-${{ steps.get-hash.outputs.commit-hash }}

      - name: Save New Commit Hash
        if: steps.cache-hash.outputs.cache-hit != 'true'
        run: |
          echo ${{ steps.get-hash.outputs.commit-hash }} | 
            tee .$REPO_NAME-$REPO_BRANCH-commit-hash
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check Server Performance
      run: |
        echo "警告⚠"
        echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
        echo -e "已知CPU型号（降序）：7763，8370C，8272CL，8171M，E5-2673 \n"
        echo "--------------------------CPU信息--------------------------"
        echo "CPU物理数量：$(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
        echo -e "CPU核心信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
        echo "--------------------------内存信息--------------------------"
        echo "已安装内存详细信息："
        echo -e "$(sudo lshw -short -C memory | grep GiB) \n"
        echo "--------------------------硬盘信息--------------------------"
        echo "硬盘数量：$(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT

    - name: Checkout
      uses: actions/checkout@main

    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        # this might remove tools that are actually needed,
        # if set to "true" but frees about 6 GB
        preinstalled-runtimes: true
        docker-images: true
        # all of these default to true, but feel free to set to
        # "false" if necessary for your workflow
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: true

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # 注意: 不要删 /etc/apt/sources.list.d —— 24.04 runner 上那是唯一的 apt 源
        sudo -E apt-get update
        sudo -E apt-get -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison \
          build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
          gcc-multilib g++-multilib gettext genisoimage git gperf haveged help2man intltool \
          libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev \
          libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev \
          libreadline-dev libssl-dev libtool llvm lrzsz msmtp ninja-build p7zip p7zip-full \
          patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync \
          scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget \
          xmlto xxd zlib1g-dev
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p "${{ github.workspace }}/workdir"
        sudo chown "$USER:$GROUPS" "${{ github.workspace }}/workdir"
        echo "----- 依赖检查 -----"
        for b in gcc g++ make python3 rsync unzip; do printf '%-8s %s\n' "$b" "$(command -v $b || echo MISSING)"; done
        df -hT /

    - name: Clone source code
      working-directory: ${{ github.workspace }}/workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf ${{ github.workspace }}/workdir/openwrt $GITHUB_WORKSPACE/openwrt
        echo "LEDE_COMMIT=$(git -C openwrt rev-parse HEAD)" >> $GITHUB_ENV
        echo "SHORT_COMMIT=$(git -C openwrt rev-parse --short HEAD)" >> $GITHUB_ENV
        git -C openwrt log -1 --format='LEDE commit: %H%n提交日期: %ci%n标题: %s'

    # 把 commit 显式打到运行页, 免得下次构建插件时还要翻 release 正文去找
    - name: Record LEDE commit
      run: |
        {
          echo "## 本固件对应的 LEDE commit"
          echo ""
          echo '```'
          echo "$LEDE_COMMIT"
          echo '```'
          echo ""
          echo "构建网易云解锁 ipk 时, 把上面这串填进 \`Build UNM ipk (standalone)\` 的 \`lede_commit\`,"
          echo "或在命令行执行:"
          echo ""
          echo '```sh'
          echo "gh workflow run build_unm_pkg.yml -f lede_commit=$LEDE_COMMIT"
          echo '```'
          echo ""
          echo "commit 不同则 ipk 不能通用: node 链接的 libc/libstdc++/openssl 版本由该 commit 决定。"
        } >> $GITHUB_STEP_SUMMARY

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    # 新增: 断言 node / unblockneteasemusic 均未进入固件配置
    # 任意一个包若重新引入对 node 的依赖, 这里会立即失败, 避免白跑一小时
    - name: Verify node is excluded from firmware
      run: |
        cd openwrt
        make defconfig
        echo "----- node / unblockneteasemusic 断言 -----"
        if grep -qE '^CONFIG_PACKAGE_(node|node-npm)=y' .config; then
          echo "::error::node 仍被选中, 说明还有包依赖它"
          grep -nE '^CONFIG_PACKAGE_(node|node-npm)=y' .config
          exit 1
        fi
        if grep -qE '^CONFIG_PACKAGE_luci-app-unblockneteasemusic=y' .config; then
          echo "::error::luci-app-unblockneteasemusic 仍在固件配置中"
          exit 1
        fi
        if ! grep -qE '^CONFIG_PACKAGE_dnsmasq-full=y' .config; then
          echo "::warning::dnsmasq-full 未被选中, 安装 UNM ipk 时会发生 dnsmasq 替换"
        fi
        # 统一到 feed 版 v3.4: 插件目录必须保持 feeds 的符号链接形态,
        # 若变成真实目录说明被 diy 脚本 clone 覆盖成了上游旧版(v2.15, ipset 分流)
        UNM_DIR=package/feeds/luci/luci-app-unblockneteasemusic
        if [ -d "$UNM_DIR" ] && [ ! -L "$UNM_DIR" ]; then
          echo "::error::${UNM_DIR} 是真实目录, 疑似被 clone 覆盖成上游旧版"
          exit 1
        fi
        # 运行时依赖检查(缺任何一项, 插件 ipk 装上去也跑不起来)
        # firewall4/nftables-json/ucode: v3.4 的 fw4+nftset 分流; ucode 提供 utpl 模板渲染器
        # libstdcpp/libuv: node 的 C++ 运行时与事件循环库
        for sym in firewall4 nftables-json ucode libstdcpp libuv; do
          if ! grep -qE "^CONFIG_PACKAGE_${sym}=y" .config; then
            echo "::warning::运行时依赖 CONFIG_PACKAGE_${sym} 未选中, 插件可能无法启动"
          fi
        done
        echo "OK: 固件不含 node, 不含 unblockneteasemusic"

    - name: Download package
      run: |
        cd openwrt
        make defconfig
        make download -j8 || make download -j1 V=s
        # 清掉下载失败留下的空壳文件(小于 1KB), 否则后续编译会报校验失败
        find dl -size -1024c -type f -print -delete || true

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        # runner 实际用 `/usr/bin/bash -e {0}`, 默认**没有** pipefail;
        # 不显式开启的话 `make | tee` 的退出码是 tee 的 0, 编译失败会被当成成功。
        set -o pipefail
        echo "使用 $(nproc) 线程编译"
        # tee 出一份完整日志, 失败时用于定位
        if ! make -j"$(nproc)" 2>&1 | tee build.log; then
          echo "::warning::并行编译失败, 用 -j1 V=s 重试一次以获取确定的错误位置"
          if ! make -j1 V=s 2>&1 | tee -a build.log; then
            echo "::error::编译失败, 详见 artifact 中的 build.log"
            exit 1
          fi
        fi
        echo "status=success" >> $GITHUB_OUTPUT
        echo "----- 产物清单 -----"
        ls -lh bin/targets/*/*/ 2>/dev/null || true
        # x86 Generic 没有 DEVICE_* 项, 该 grep 无匹配是正常的, 不能让步骤失败
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config 2>/dev/null \
          | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME || true
        if [ -s DEVICE_NAME ]; then
          echo "DEVICE_NAME=_$(head -1 DEVICE_NAME)" >> $GITHUB_ENV
        fi
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    # 失败时把关键信息直接打到日志里, 不必下载 artifact 就能判断原因
    - name: Report build failure
      if: failure()
      run: |
        echo "=========== build.log 尾部 200 行 ==========="
        tail -n 200 openwrt/build.log 2>/dev/null || echo "(build.log 不存在, 说明失败发生在编译之前)"
        echo "=========== bin 目录 ==========="
        ls -l openwrt/bin 2>/dev/null || echo "(bin 不存在: 编译未完成)"
        echo "=========== 磁盘 ==========="
        df -hT /

    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: build-log-${{ env.REPO_NAME }}-${{ github.run_id }}
        path: |
          openwrt/build.log
          openwrt/.config
        if-no-files-found: ignore

    - name: Upload bin directory
      uses: actions/upload-artifact@v7
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
      run: |
        # 不用 cd 通配符: 目录不存在时给出可读的报错, 而不是 No such file or directory
        TARGET_DIR=$(echo openwrt/bin/targets/*/* | cut -d' ' -f1)
        if [ ! -d "$TARGET_DIR" ]; then
          echo "::error::未找到固件输出目录, 编译未产出镜像"
          ls -R openwrt/bin 2>/dev/null | head -50 || echo "(bin 不存在)"
          exit 1
        fi
        cd "$TARGET_DIR"
        rm -rf packages
        ls -lh
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@v7
      if: steps.organize.outputs.status == 'success'
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
      run: |
        # 加 MJ- 前缀, 与 GXT 那台的 release 彻底隔离(tag 相同会互相覆盖)
        echo "release_tag=MJ-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        {
          echo "【MJ】固件不含 luci-app-unblockneteasemusic 与 node。"
          echo ""
          echo "- LEDE commit: \`${LEDE_COMMIT}\`"
          echo ""
          echo "配套的网易云解锁 ipk(v3.4, 与 GXT 通用)请在 Build UNM ipk (standalone) 中使用同一 commit 构建。"
        } > release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v3
      if: steps.tag.outputs.status == 'success'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    # 只清理 MJ- 前缀的 release, 避免把 GXT 那台的 release 一并删掉
    # 必须挂在 tag 成功之后: 否则编译失败时也会跑, 白白删掉历史 release
    - name: Remove old MJ releases
      if: steps.tag.outputs.status == 'success'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release list --limit 100 --json tagName --jq '.[].tagName' \
          | grep '^MJ-' | sort -r | tail -n +4 \
          | while read -r tag; do
              [ -n "$tag" ] && gh release delete "$tag" --yes --cleanup-tag
            done
