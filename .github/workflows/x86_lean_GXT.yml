# 固件 GXT · x86_64 lean, 不含 luci-app-unblockneteasemusic 与 node
# 插件由 build_unm_pkg.yml 单独出 ipk, 必须用同一 LEDE commit 构建
# 结构须与 x86_lean_MJ.yml 完全一致(仅变量不同), 由 tools/check-workflows.py 校验
# 变更记录见 CHANGELOG.md

name: Build x64 lean for GXT (no UNM)

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      force-build:
        description: "Build x64 lean for GXT without unblockneteasemusic"
        required: false
        default: "false"
  schedule:
    - cron: '30 1 * * *'

env:
  REPO_NAME: lean-x64-Openwrt
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: GXT-x86_64_mini.config
  DIY_P1_SH: GXT-diy-part1.sh
  DIY_P2_SH: GXT-diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  # defconfig 后必须仍在 .config 里的包(缺失即失败), 只列真要的
  REQUIRED_PKGS: easytier-next luci-app-easytier-next luci-theme-argon luci-app-argon-config luci-theme-design luci-app-design-config luci-theme-kucat luci-app-kucat-config luci-theme-alpha luci-app-alpha-config luci-app-zerotier luci-app-ssr-plus dnsmasq-full firewall4 ucode
  CCACHE_DIR_WORKSPACE: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 3G
  CCACHE_GEN: v1

permissions:
  contents: write

concurrency:
  group: gxt-firmware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check for source code updates
    runs-on: ubuntu-24.04
    outputs:
      cache-hit: ${{ steps.cache-hash.outputs.cache-hit }}

    steps:
      - name: Get Commit Hash
        id: get-hash
        run: |
          git clone --depth 1 --branch $REPO_BRANCH --single-branch $REPO_URL ./
          echo "commit-hash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Compare Commit Hash
        id: cache-hash
        uses: actions/cache@v6
        with:
          path: .${{ env.REPO_NAME }}-${{ env.REPO_BRANCH }}-commit-hash
          key: HEAD-${{ steps.get-hash.outputs.commit-hash }}

      - name: Save New Commit Hash
        if: steps.cache-hash.outputs.cache-hit != 'true'
        run: |
          echo ${{ steps.get-hash.outputs.commit-hash }} | tee .${{ env.REPO_NAME }}-${{ env.REPO_BRANCH }}-commit-hash

  build:
    runs-on: ubuntu-24.04
    needs: check
    if: needs.check.outputs.cache-hit != 'true' || github.event_name != 'schedule'

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Check runner environment
      run: |
        echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
        lsb_release -a || cat /etc/os-release
        echo "-------------------------- CPU --------------------------"
        lscpu | grep -E '^(Architecture|CPU\(s\)|Model name|Thread|Core|Socket)' || true
        echo "-------------------------- 内存 --------------------------"
        free -h
        echo "-------------------------- 磁盘 --------------------------"
        df -hT /

    # 第三方清理(v2.0.0, 仓库已从 jlumbroso 转到 lumbroso-commons); @main 浮动引用已改为固定 tag
    - name: Free Disk Space (Ubuntu)
      uses: lumbroso-commons/free-disk-space@v2.0.0
      with:
        preinstalled-runtimes: true
        docker-images: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        # v2.0.0 起默认 false; 保持与原配置一致, 若出现 exit 137/OOM 再改 false
        swap-storage: true

    # 不动 apt 源: 24.04 上 /etc/apt/sources.list.d 是唯一源
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get update
        sudo -E apt-get -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison \
          build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
          gcc-multilib g++-multilib gettext genisoimage git gperf haveged help2man intltool \
          libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev \
          libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev \
          libreadline-dev libssl-dev libtool llvm lrzsz msmtp ninja-build p7zip p7zip-full \
          patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync \
          scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget \
          xmlto xxd zlib1g-dev
        sudo -E systemctl daemon-reload
        sudo apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p "${{ github.workspace }}/workdir"
        sudo chown "$USER:$GROUPS" "${{ github.workspace }}/workdir"
        echo "----- 依赖检查 -----"
        for b in gcc g++ make python3 rsync unzip; do printf '%-8s %s\n' "$b" "$(command -v $b || echo MISSING)"; done
        df -hT /

    - name: Clone source code
      working-directory: ${{ github.workspace }}/workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf ${{ github.workspace }}/workdir/openwrt $GITHUB_WORKSPACE/openwrt
        echo "LEDE_COMMIT=$(git -C openwrt rev-parse HEAD)" >> $GITHUB_ENV
        echo "SHORT_COMMIT=$(git -C openwrt rev-parse --short HEAD)" >> $GITHUB_ENV
        git -C openwrt log -1 --format='LEDE commit: %H%n提交日期: %ci%n标题: %s'

    - name: Record LEDE commit
      run: |
        {
          echo "## 本固件对应的 LEDE commit"
          echo ""
          echo '```'
          echo "$LEDE_COMMIT"
          echo '```'
          echo ""
          echo "构建网易云解锁 ipk 时, 把上面这串填进 \`Build UNM ipk (standalone)\` 的 \`lede_commit\`,"
          echo "或在命令行执行:"
          echo ""
          echo '```sh'
          echo "gh workflow run build_unm_pkg.yml -f lede_commit=$LEDE_COMMIT"
          echo '```'
          echo ""
          echo "commit 不同则 ipk 不能通用: node 链接的 libc/libstdc++/openssl 版本由该 commit 决定。"
        } >> $GITHUB_STEP_SUMMARY

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE $GITHUB_WORKSPACE/requested.config || true
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    # kconfig 静默丢弃不存在的符号, 得自己查
    - name: Verify node is excluded from firmware
      run: |
        cd openwrt
        set -o pipefail
        make defconfig 2>&1 | tee /tmp/defconfig.log
        echo "----- node / unblockneteasemusic 断言 -----"
        if grep -qE '^CONFIG_PACKAGE_(node|node-npm)=y' .config; then
          echo "::error::node 仍被选中, 说明还有包依赖它"
          grep -nE '^CONFIG_PACKAGE_(node|node-npm)=y' .config
          exit 1
        fi
        if grep -qE '^CONFIG_PACKAGE_luci-app-unblockneteasemusic=y' .config; then
          echo "::error::luci-app-unblockneteasemusic 仍在固件配置中"
          exit 1
        fi
        if ! grep -qE '^CONFIG_PACKAGE_dnsmasq-full=y' .config; then
          echo "::warning::dnsmasq-full 未被选中, 安装 UNM ipk 时会发生 dnsmasq 替换"
        fi
        UNM_DIR=package/feeds/luci/luci-app-unblockneteasemusic
        if [ -d "$UNM_DIR" ] && [ ! -L "$UNM_DIR" ]; then
          echo "::error::${UNM_DIR} 是真实目录, 疑似被 clone 覆盖成上游旧版"
          exit 1
        fi
        for sym in firewall4 nftables-json ucode libstdcpp libuv; do
          if ! grep -qE "^CONFIG_PACKAGE_${sym}=y" .config; then
            echo "::warning::运行时依赖 CONFIG_PACKAGE_${sym} 未选中, 插件可能无法启动"
          fi
        done
        REQ=$GITHUB_WORKSPACE/requested.config
        if [ ! -f "$REQ" ]; then
          echo "::warning::找不到 requested.config, 跳过配置符号存活检查"
        else
          echo "----- 配置符号存活检查 -----"
          dropped=0
          missingreq=0
          for line in $(grep -E '^CONFIG_PACKAGE_[A-Za-z0-9_.+-]+=y$' "$REQ" | sort -u); do
            sym=${line#CONFIG_PACKAGE_}
            sym=${sym%=y}
            if awk -v s="CONFIG_PACKAGE_${sym}=" 'index($0,s)==1 && (/=y$/ || /=m$/){f=1} END{exit !f}' .config; then
              continue
            fi
            dropped=$((dropped+1))
            reason="依赖不满足, 被牵连关闭"
            if [ -f tmp/.config-package.in ] || [ -f tmp/.packageinfo ]; then
              if { [ -f tmp/.config-package.in ] \
                     && awk -v s="config PACKAGE_${sym}" '$0==s{f=1} END{exit !f}' tmp/.config-package.in; } \
                 || { [ -f tmp/.packageinfo ] && grep -qxF "Package: ${sym}" tmp/.packageinfo; }; then
                :
              else
                reason="不在任何 feed 中, 包名很可能写错"
              fi
            else
              reason="缺少包元数据(tmp/.config-package.in 与 tmp/.packageinfo 都不存在), 无法判定"
            fi
            case " ${REQUIRED_PKGS} " in
              *" ${sym} "*)
                echo "::error::必需包 CONFIG_PACKAGE_${sym} 没进入 .config —— ${reason}"
                missingreq=$((missingreq+1)) ;;
              *)
                echo "::warning::CONFIG_PACKAGE_${sym} 未生效 —— ${reason}" ;;
            esac
          done
          echo "未生效符号: ${dropped} 个; REQUIRED_PKGS 中缺失: ${missingreq} 个"
          if [ "$missingreq" -gt 0 ]; then
            echo "::error::配置点名的必需包没有生效, 固件不会包含它们; 先改配置再编译, 不要白跑一小时"
            exit 1
          fi
        fi
        if [ -f /tmp/defconfig.log ]; then
          echo "----- 已选中包的依赖落空检查 -----"
          deperr=0
          while IFS='|' read -r mkfile dep; do
            [ -n "$mkfile" ] || continue
            pkg=$(basename "$(dirname "$mkfile")")
            if grep -qx "CONFIG_PACKAGE_${pkg}=y" .config; then
              echo "::error::${pkg} 已选中, 但依赖 ${dep} 不存在 —— 镜像组装(package/install)必然失败"
              deperr=$((deperr+1))
            else
              echo "  (忽略) ${pkg} 依赖 ${dep} 不存在, 但该包未被选中"
            fi
          done < <(awk -F"'" '/^WARNING: Makefile .* has a dependency on .*, which does not exist$/ {print $2 "|" $4}' /tmp/defconfig.log | sort -u)
          echo "依赖落空的已选中包: ${deperr} 个"
          if [ "$deperr" -gt 0 ]; then
            echo "::error::有 ${deperr} 个已选中包的依赖不存在, 现在停下比跑到 package/install 再报错划算"
            exit 1
          fi
        else
          echo "::warning::没有 /tmp/defconfig.log, 跳过依赖落空检查"
        fi
        echo "OK: 固件不含 node, 不含 unblockneteasemusic"

    - name: Compute ccache key
      run: |
        FILES=".github/workflows/x86_lean_GXT.yml"
        [ -f "$GITHUB_WORKSPACE/requested.config" ] && FILES="$GITHUB_WORKSPACE/requested.config $FILES"
        FINGERPRINT=$(sha256sum $FILES | sha256sum | cut -c1-12)
        PREFIX="ccache-x64-gxt-${LEDE_COMMIT}"
        {
          echo "CCACHE_KEY_PREFIX=${PREFIX}"
          echo "CCACHE_KEY=${PREFIX}-${FINGERPRINT}-${CCACHE_GEN}"
        } >> $GITHUB_ENV
        echo "配置指纹  : ${FINGERPRINT}"
        echo "缓存代次  : ${CCACHE_GEN}"
        echo "ccache 键 : ${PREFIX}-${FINGERPRINT}-${CCACHE_GEN}"

    - name: Restore ccache
      id: ccache-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ env.CCACHE_DIR_WORKSPACE }}
        key: ${{ env.CCACHE_KEY }}
        restore-keys: |
          ${{ env.CCACHE_KEY_PREFIX }}-
          ccache-x64-gxt-
          ccache-x64-

    # erofs 上游裸名 404/空 body; 改用 GitHub archive, hash 与 PKG_HASH 一致
    - name: Pre-seed dl
      run: |
        cd openwrt
        mkdir -p dl
        seed() {
          name="$1"; f="dl/$1"; want="$2"; shift 2
          if [ -s "$f" ] && [ "$(sha256sum "$f" | cut -d' ' -f1)" = "$want" ]; then
            echo "OK    $f 已存在, 校验通过"
            return 0
          fi
          rm -f "$f"
          for u in "$@"; do
            echo "尝试 $u"
            if curl -fsSL --retry 3 --retry-delay 3 --connect-timeout 20 --max-time 300 -o "$f.part" "$u"; then
              got=$(sha256sum "$f.part" | cut -d' ' -f1)
              if [ "$got" = "$want" ]; then
                mv "$f.part" "$f"
                echo "OK    $f ($(stat -c%s "$f") 字节)"
                return 0
              fi
              echo "::warning::校验不符: 期望 $want, 实际 $got"
            fi
            rm -f "$f.part"
          done
          echo "::error::无法获取 $name (期望 sha256 $want)"
          return 1
        }

        seed erofs-utils-1.8.10.tar.gz \
          05eb4edebe11decce6ecb34e98d2f80c8cd283c2f2967d8ba7efd58418570514 \
          https://github.com/erofs/erofs-utils/archive/refs/tags/v1.8.10.tar.gz \
          https://codeload.github.com/erofs/erofs-utils/tar.gz/refs/tags/v1.8.10

    # toplevel.mk 用分号串 4 个子目录, 退出码只看最后一个, 必须逐目录复核
    - name: Download package
      run: |
        cd openwrt
        make defconfig

        make download -j8 || true

        dl_fail=0
        for d in tools toolchain package target; do
          echo "----- 复核 $d/download -----"
          if make "$d/download" -j4 > "/tmp/dl_$d.log" 2>&1; then
            echo "OK    $d/download"
            continue
          fi
          echo "::warning::$d/download 并行失败, 降级 -j1 V=s 重试"
          if make "$d/download" -j1 V=s > "/tmp/dl_$d.log" 2>&1; then
            echo "OK    $d/download (串行重试通过)"
            continue
          fi
          echo "::error::$d 阶段仍有源码下载失败, 关键行:"
          grep -E "Download failed|No more mirrors|curl: \(|ERROR:|Error [0-9]+" "/tmp/dl_$d.log" | tail -20 || true
          dl_fail=1
        done

        find dl -size -1024c -type f -print -delete || true

        if [ "$dl_fail" -ne 0 ]; then
          echo "::error::源码下载不完整, 已在编译前中止(不再白编 20 分钟)"
          exit 1
        fi
        echo "OK    全部源码下载完成"

    # 必须 pipefail, 否则 make 经 tee 后判的是 tee 的退出码
    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        set -o pipefail
        echo "使用 $(nproc) 线程编译"
        CCACHE_OPTS="CONFIG_CCACHE=y CONFIG_CCACHE_DIR=$CCACHE_DIR_WORKSPACE"
        mkdir -p "$CCACHE_DIR_WORKSPACE"
        export LC_ALL=C
        echo "ccache 目录: $CCACHE_DIR_WORKSPACE (上限 $CCACHE_MAXSIZE)"
        ccache_report() {
          local bin="$1"
          if [ ! -x "$bin" ] && ! command -v "$bin" >/dev/null 2>&1; then
            echo "   (找不到 ${bin}, 跳过统计)"; return 0
          fi
          CCACHE_DIR="$CCACHE_DIR_WORKSPACE" "$bin" -s 2>/dev/null | awk '
            /Cacheable calls/ {v=$0; sub(/^[^:]*:[[:space:]]*/,"",v); split(v,a,"/"); gsub(/[^0-9]/,"",a[1]); calls=a[1]+0}
            /Hits:/           {v=$0; sub(/^[^:]*:[[:space:]]*/,"",v); split(v,b,"/"); gsub(/[^0-9]/,"",b[1]); hits=b[1]+0}
            END{ if (calls > 0) printf "   可缓存调用 %d 次, 命中 %d 次 (命中率 %.1f%%)\n", calls, hits, hits*100/calls;
                 else printf "   尚无统计(缓存为空, 或 ccache 未真正参与编译)\n" }'
        }
        echo "编译前 ccache:"; ccache_report ccache
        if ! make -j"$(nproc)" $CCACHE_OPTS 2>&1 | tee build.log; then
          echo "::warning::并行编译失败, 用 -j1 V=s 重试一次以获取确定的错误位置"
          if ! make -j1 V=s $CCACHE_OPTS 2>&1 | tee -a build.log; then
            echo "::error::编译失败, 详见 artifact 中的 build.log"
            exit 1
          fi
        fi
        echo "status=success" >> $GITHUB_OUTPUT
        echo "----- ccache 统计(编译后) -----"
        if [ -x staging_dir/host/bin/ccache ]; then
          ccache_report staging_dir/host/bin/ccache
        else
          echo "::warning::staging_dir/host/bin/ccache 不存在, ccache 可能没有真正启用"
        fi
        echo "----- 产物清单 -----"
        ls -lh bin/targets/*/*/ 2>/dev/null || true
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config 2>/dev/null \
          | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME || true
        if [ -s DEVICE_NAME ]; then
          echo "DEVICE_NAME=_$(head -1 DEVICE_NAME)" >> $GITHUB_ENV
        fi
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    # manifest 是唯一过硬证据; 库名带 ABI 后缀(libstdcpp6)
    - name: Verify firmware contains required packages
      run: |
        cd openwrt
        mapfile -t MANIFESTS < <(ls bin/targets/*/*/*.manifest 2>/dev/null)
        if [ "${#MANIFESTS[@]}" -eq 0 ]; then
          echo "::error::找不到 bin/targets 下的 manifest, 无法核对固件内容"
          ls -l bin/targets/*/*/ 2>/dev/null || true
          exit 1
        fi
        echo "核对 manifest: ${MANIFESTS[*]}"
        miss=0
        for m in "${MANIFESTS[@]}"; do
          echo "--- ${m}"
          for p in ${REQUIRED_PKGS}; do
            hit=$(awk -v n="$p" '
              $2!="-"{next}
              $1==n {print $1" "$3; exit}
              $1 ~ ("^" n "[0-9]+$") {print $1" "$3; exit}
            ' "$m")
            if [ -n "$hit" ]; then
              echo "  有  ${p} -> ${hit}"
            else
              echo "::error::${m} 里没有 ${p} —— 配置里选了但没编进镜像"
              miss=$((miss+1))
            fi
          done
        done
        if [ "$miss" -gt 0 ]; then
          echo "::error::共 ${miss} 处必需包缺失, 该镜像不可用"
          exit 1
        fi
        echo "OK: ${#MANIFESTS[@]} 个 manifest 均含全部必需包"

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Inspect ccache
      id: ccache-size
      if: (!cancelled())
      run: |
        mkdir -p "$CCACHE_DIR_WORKSPACE"
        SIZE=$(du -sm "$CCACHE_DIR_WORKSPACE" | cut -f1)
        echo "ccache 目录大小: ${SIZE} MB"
        if [ "${SIZE:-0}" -ge 300 ]; then WORTH=true; else WORTH=false; fi
        echo "worth=${WORTH}" >> $GITHUB_OUTPUT
        echo "是否保存缓存: ${WORTH} (阈值 300MB)"
        CCACHE_BIN=openwrt/staging_dir/host/bin/ccache
        if [ -x "$CCACHE_BIN" ]; then
          echo "----- ccache 最终统计 -----"
          CCACHE_DIR="$CCACHE_DIR_WORKSPACE" "$CCACHE_BIN" -s 2>/dev/null | sed -n '1,14p' || true
        fi

    - name: Save ccache
      if: always() && !cancelled() && steps.ccache-size.outputs.worth == 'true' && steps.ccache-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ env.CCACHE_DIR_WORKSPACE }}
        key: ${{ env.CCACHE_KEY }}

    - name: Report build failure
      if: failure()
      run: |
        echo "=========== build.log 尾部 200 行 ==========="
        tail -n 200 openwrt/build.log 2>/dev/null || echo "(build.log 不存在, 说明失败发生在编译之前)"
        echo "=========== bin 目录 ==========="
        ls -l openwrt/bin 2>/dev/null || echo "(bin 不存在: 编译未完成)"
        echo "=========== 磁盘 ==========="
        df -hT /

    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: build-log-${{ env.REPO_NAME }}-${{ github.run_id }}
        path: |
          openwrt/build.log
          openwrt/.config
        if-no-files-found: ignore

    - name: Upload bin directory
      uses: actions/upload-artifact@v7
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
      run: |
        TARGET_DIR=$(echo openwrt/bin/targets/*/* | cut -d' ' -f1)
        if [ ! -d "$TARGET_DIR" ]; then
          echo "::error::未找到固件输出目录, 编译未产出镜像"
          ls -R openwrt/bin 2>/dev/null | head -50 || echo "(bin 不存在)"
          exit 1
        fi
        cd "$TARGET_DIR"
        rm -rf packages
        ls -lh
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@v7
      if: steps.organize.outputs.status == 'success'
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    # 空 tag 会生成 untagged-<hash> 草稿, 先校验格式
    - name: Generate release tag
      id: tag
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
      run: |
        TAG="GXT-$(date +"%Y.%m.%d-%H%M")"
        case "$TAG" in
          GXT-[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]-[0-9][0-9][0-9][0-9]) ;;
          *) echo "::error::生成的 tag 格式不合法: '$TAG'"; exit 1 ;;
        esac
        echo "release_tag=${TAG}" >> $GITHUB_OUTPUT
        {
          echo "【GXT】固件不含 luci-app-unblockneteasemusic 与 node。"
          echo ""
          echo "- LEDE commit: \`${LEDE_COMMIT}\`"
          echo ""
          echo "配套的网易云解锁 ipk(v3.4, 与 MJ 通用)请在 Build UNM ipk (standalone) 中使用同一 commit 构建。"
        } > release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v3
      if: steps.tag.outputs.status == 'success' && steps.tag.outputs.release_tag != ''
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        draft: false
        prerelease: false
        fail_on_unmatched_files: true
        files: ${{ env.FIRMWARE }}/*

    - name: Delete old workflow runs
      if: steps.tag.outputs.status == 'success'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh run list --workflow x86_lean_GXT.yml --limit 60 \
          --json databaseId --jq '.[].databaseId' \
          | tail -n +3 \
          | while read -r id; do gh run delete "$id" || true; done

    - name: Remove old GXT releases
      if: steps.tag.outputs.status == 'success'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release list --limit 200 --json tagName,isDraft \
          --jq '.[] | select(.isDraft) | .tagName' \
          | grep '^untagged-' \
          | while read -r tag; do
              echo "删除草稿 release: $tag"
              gh release delete "$tag" --yes 2>/dev/null || true
            done

        gh release list --limit 100 --json tagName --jq '.[].tagName' \
          | grep '^GXT-' | sort -r | tail -n +4 \
          | while read -r tag; do
              [ -n "$tag" ] && gh release delete "$tag" --yes --cleanup-tag
            done
