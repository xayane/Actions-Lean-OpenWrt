name: Build x64 lean for GXT R2Max

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      force-build:
        description: "Build x64 lean for GXT R2Max"
        required: false
        default: "false"
  # Uncomment the following to run regularly. Note that the cron expression here does not contain seconds.
  schedule:
    - cron: '30 1 * * *'

env:
  REPO_NAME: lean-x64-Openwrt
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: GXT-x86_64_mini.config
  DIY_P1_SH: GXT-diy-part1.sh
  DIY_P2_SH: GXT-diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  REQUIRED_PKGS: easytier-next luci-app-easytier-next luci-app-zerotier luci-app-ssr-plus
  CCACHE_DIR_WORKSPACE: ${{ github.workspace }}/.ccache
  # 单个仓库的 Actions 缓存上限是 10GB, 这里给 ccache 留 2GB(ccache 4.x 默认 zstd 压缩)。
  CCACHE_MAXSIZE: 2G

# 最小权限: 只读仓库即可编译, 发布 release 需要 contents: write
permissions:
  contents: write

# 同一分支只跑一个, 避免定时任务与手工触发抢 runner、互相覆盖 release 标签
concurrency:
  group: mj-firmware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check for source code updates
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache-hash.outputs.cache-hit }}

    steps:
      - name: Get Commit Hash
        id: get-hash
        run: |
          git clone --depth 1 --branch $REPO_BRANCH --single-branch $REPO_URL ./
          echo "commit-hash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Compare Commit Hash
        id: cache-hash
        uses: actions/cache@main
        with:
          path: .${{ env.REPO_NAME }}-${{ env.REPO_BRANCH }}-commit-hash
          key: HEAD-${{ steps.get-hash.outputs.commit-hash }}

      - name: Save New Commit Hash
        if: steps.cache-hash.outputs.cache-hit != 'true'
        run: |
          echo ${{ steps.get-hash.outputs.commit-hash }} | 
            tee .$REPO_NAME-$REPO_BRANCH-commit-hash
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check Server Performance
      run: |
        echo "警告⚠"
        echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
        echo -e "已知CPU型号（降序）：7763，8370C，8272CL，8171M，E5-2673 \n"
        echo "--------------------------CPU信息--------------------------"
        echo "CPU物理数量：$(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
        echo -e "CPU核心信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
        echo "--------------------------内存信息--------------------------"
        echo "已安装内存详细信息："
        echo -e "$(sudo lshw -short -C memory | grep GiB) \n"
        echo "--------------------------硬盘信息--------------------------"
        echo "硬盘数量：$(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT
          
    - name: Checkout
      uses: actions/checkout@main

    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        # this might remove tools that are actually needed,
        # if set to "true" but frees about 6 GB
        preinstalled-runtimes: true
        docker-images: true
        # all of these default to true, but feel free to set to
        # "false" if necessary for your workflow
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: true

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get update
        sudo -E apt-get -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool llvm lrzsz msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E systemctl daemon-reload
        sudo apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown "$USER:$GROUPS" /workdir
        echo "----- 依赖检查 -----"
        for b in gcc g++ make python3 rsync unzip; do printf '%-8s %s\n' "$b" "$(command -v $b || echo MISSING)"; done
        df -hT /

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
        echo "LEDE_COMMIT=$(git -C openwrt rev-parse HEAD)" >> $GITHUB_ENV
        echo "SHORT_COMMIT=$(git -C openwrt rev-parse --short HEAD)" >> $GITHUB_ENV
        git -C openwrt log -1 --format='LEDE commit: %H%n提交日期: %ci%n标题: %s'

    # 把 commit 显式打到运行页, 免得下次构建插件时还要翻 release 正文去找
    - name: Record LEDE commit
      run: |
        {
          echo "## 本固件对应的 LEDE commit"
          echo ""
          echo '```'
          echo "$LEDE_COMMIT"
          echo '```'
          echo ""
          echo "构建网易云解锁 ipk 时, 把上面这串填进 \`Build UNM ipk (standalone)\` 的 \`lede_commit\`,"
          echo "或在命令行执行:"
          echo ""
          echo '```sh'
          echo "gh workflow run build_unm_pkg.yml -f lede_commit=$LEDE_COMMIT"
          echo '```'
          echo ""
          echo "commit 不同则 ipk 不能通用: node 链接的 libc/libstdc++/openssl 版本由该 commit 决定。"
        } >> $GITHUB_STEP_SUMMARY

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    # 新增: 断言 node / unblockneteasemusic 均未进入固件配置
    - name: Verify node is excluded from firmware
      run: |
        cd openwrt
        make defconfig
        echo "----- node / unblockneteasemusic 断言 -----"
        if grep -qE '^CONFIG_PACKAGE_(node|node-npm)=y' .config; then
          echo "::error::node 仍被选中, 说明还有包依赖它"
          grep -nE '^CONFIG_PACKAGE_(node|node-npm)=y' .config
          exit 1
        fi
        if grep -qE '^CONFIG_PACKAGE_luci-app-unblockneteasemusic=y' .config; then
          echo "::error::luci-app-unblockneteasemusic 仍在固件配置中"
          exit 1
        fi
        if ! grep -qE '^CONFIG_PACKAGE_dnsmasq-full=y' .config; then
          echo "::warning::dnsmasq-full 未被选中, 安装 UNM ipk 时会发生 dnsmasq 替换"
        fi
        # 统一到 feed 版 v3.4: 插件目录必须保持 feeds 的符号链接形态,
        # 若变成真实目录说明被 diy 脚本 clone 覆盖成了上游旧版(v2.15, ipset 分流)
        UNM_DIR=package/feeds/luci/luci-app-unblockneteasemusic
        if [ -d "$UNM_DIR" ] && [ ! -L "$UNM_DIR" ]; then
          echo "::error::${UNM_DIR} 是真实目录, 疑似被 clone 覆盖成上游旧版"
          exit 1
        fi
        # 运行时依赖检查(缺任何一项, 插件 ipk 装上去也跑不起来)
        # firewall4/nftables-json/ucode: v3.4 的 fw4+nftset 分流; ucode 提供 utpl 模板渲染器
        # libstdcpp/libuv: node 的 C++ 运行时与事件循环库
        for sym in firewall4 nftables-json ucode libstdcpp libuv; do
          if ! grep -qE "^CONFIG_PACKAGE_${sym}=y" .config; then
            echo "::warning::运行时依赖 CONFIG_PACKAGE_${sym} 未选中, 插件可能无法启动"
          fi
        done
        #---------------------------------------------------------------
        # 配置符号存活检查(2026-11-10 新增, 针对"easytier 设了却没编进去")
        #
        # kconfig 对不存在的符号是完全静默的: 手写配置里写
        # CONFIG_PACKAGE_luci-app-easytier=y, 但没有任何 feed 提供该包时,
        # make defconfig 只把这行删掉, 编译照常 success, 固件里就是没有。
        # 本次 easytier 缺失就是这个原因(lean luci feed 只有 luci-app-easytier-next)。
        #
        # 做法: 拿 requested.config 里每个 CONFIG_PACKAGE_*=y 去 .config 里找;
        #   找不到 → 再查包元数据
        #     · 符号在元数据里也不存在 = 没有任何 feed 提供 → ERROR(包名写错)
        #     · 符号存在但没被选中     = 依赖不满足被牵连 → WARNING
        # 用 awk 做整行/前缀比较, 避免包名里的 . + 被 grep -E 当正则解释。
        #---------------------------------------------------------------
        REQ=$GITHUB_WORKSPACE/requested.config
        if [ ! -f "$REQ" ]; then
          echo "::warning::找不到 requested.config, 跳过配置符号存活检查"
        else
          echo "----- 配置符号存活检查 -----"
          dropped=0
          missingreq=0
          for line in $(grep -E '^CONFIG_PACKAGE_[A-Za-z0-9_.+-]+=y$' "$REQ" | sort -u); do
            sym=${line#CONFIG_PACKAGE_}
            sym=${sym%=y}
            if awk -v s="CONFIG_PACKAGE_${sym}=" 'index($0,s)==1 && (/=y$/ || /=m$/){f=1} END{exit !f}' .config; then
              continue
            fi
            dropped=$((dropped+1))
            # 原因分类: 元数据里查不到 = 没有任何 feed 提供; 查得到但没选中 = 依赖不满足
            reason="依赖不满足, 被牵连关闭"
            if [ -f tmp/.config-package.in ] || [ -f tmp/.packageinfo ]; then
              if { [ -f tmp/.config-package.in ] \
                     && awk -v s="config PACKAGE_${sym}" '$0==s{f=1} END{exit !f}' tmp/.config-package.in; } \
                 || { [ -f tmp/.packageinfo ] && grep -qxF "Package: ${sym}" tmp/.packageinfo; }; then
                :
              else
                reason="不在任何 feed 中, 包名很可能写错"
              fi
            else
              reason="缺少包元数据(tmp/.config-package.in 与 tmp/.packageinfo 都不存在), 无法判定"
            fi
            # 只有 REQUIRED_PKGS 里点名的才硬失败, 其余只告警:
            # 历史遗留的无效项不该挡住一次一小时的编译, 但必须留下可见的注解。
            case " ${REQUIRED_PKGS} " in
              *" ${sym} "*)
                echo "::error::必需包 CONFIG_PACKAGE_${sym} 没进入 .config —— ${reason}"
                missingreq=$((missingreq+1)) ;;
              *)
                echo "::warning::CONFIG_PACKAGE_${sym} 未生效 —— ${reason}" ;;
            esac
          done
          echo "未生效符号: ${dropped} 个; REQUIRED_PKGS 中缺失: ${missingreq} 个"
          if [ "$missingreq" -gt 0 ]; then
            echo "::error::配置点名的必需包没有生效, 固件不会包含它们; 先改配置再编译, 不要白跑一小时"
            exit 1
          fi
        fi
        echo "OK: 固件不含 node, 不含 unblockneteasemusic"

    - name: Compute ccache key
      run: |
        # requested.config 由 Load custom configuration 复制而来; 万一缺失也不能让本步失败,
        # 退化为只对 workflow 文件求指纹(最坏情况只是缓存键不随配置变化)。
        FILES=".github/workflows/x86_lean_GXT.yml"
        [ -f "$GITHUB_WORKSPACE/requested.config" ] && FILES="$GITHUB_WORKSPACE/requested.config $FILES"
        FINGERPRINT=$(sha256sum $FILES | sha256sum | cut -c1-12)
        PREFIX="ccache-x64-gxt-${LEDE_COMMIT}"
        {
          echo "CCACHE_KEY_PREFIX=${PREFIX}"
          echo "CCACHE_KEY=${PREFIX}-${FINGERPRINT}-${GITHUB_RUN_ID}"
        } >> $GITHUB_ENV
        echo "配置指纹  : ${FINGERPRINT}"
        echo "ccache 键 : ${PREFIX}-${FINGERPRINT}-${GITHUB_RUN_ID}"

    # 用 restore/save 两步而不是单个 actions/cache:
    # 单步的保存动作是 post-if: success(), 编译失败就不落盘 —— 而"失败后重跑"正是
    # 最需要缓存救命的场景(上次跑到第 50 分钟失败, 重跑不必再编一遍工具链和内核)。
    - name: Restore ccache
      uses: actions/cache/restore@v6
      with:
        path: ${{ env.CCACHE_DIR_WORKSPACE }}
        key: ${{ env.CCACHE_KEY }}
        restore-keys: |
          ${{ env.CCACHE_KEY_PREFIX }}-
          ccache-x64-gxt-
          ccache-x64-

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8 || make download -j1 V=s
        # 清掉下载失败留下的空壳文件(小于 1KB), 否则后续编译会报校验失败
        find dl -size -1024c -type f -print -delete || true

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        # runner 实际用 `/usr/bin/bash -e {0}`, 默认**没有** pipefail;
        # 不显式开启的话 `make | tee` 的退出码是 tee 的 0, 编译失败会被当成成功。
        set -o pipefail
        echo "使用 $(nproc) 线程编译"
        # ccache 走命令行变量(原因见文件头 env 段的注释)。
        # 变量必须跟着每一次 make 传, 因为 runner 的各个 run 步骤之间不共享 shell 变量。
        CCACHE_OPTS="CONFIG_CCACHE=y CONFIG_CCACHE_DIR=$CCACHE_DIR_WORKSPACE"
        mkdir -p "$CCACHE_DIR_WORKSPACE"
        export LC_ALL=C
        echo "ccache 目录: $CCACHE_DIR_WORKSPACE (上限 $CCACHE_MAXSIZE)"
        ccache_val() { command -v ccache >/dev/null 2>&1 || return 0
          ccache -s 2>/dev/null | grep -m1 "^$1" | sed -E 's/[^0-9]*([0-9]+).*/\1/'; }
        echo "编译前: ccache 可缓存调用 $(ccache_val 'Cacheable calls') 次, 命中 $(ccache_val 'Hits') 次"
        # tee 出一份完整日志, 失败时用于定位
        if ! make -j"$(nproc)" $CCACHE_OPTS 2>&1 | tee build.log; then
          echo "::warning::并行编译失败, 用 -j1 V=s 重试一次以获取确定的错误位置"
          if ! make -j1 V=s $CCACHE_OPTS 2>&1 | tee -a build.log; then
            echo "::error::编译失败, 详见 artifact 中的 build.log"
            exit 1
          fi
        fi
        echo "status=success" >> $GITHUB_OUTPUT
        # 用 OpenWrt 自编的 ccache(4.10.2, 在 staging_dir/host/bin)读统计, 与编译时用的是同一个二进制
        CCACHE_BIN=staging_dir/host/bin/ccache
        if [ -x "$CCACHE_BIN" ]; then
          echo "----- ccache 统计 -----"
          "$CCACHE_BIN" -s 2>/dev/null | sed -n '1,16p' || true
        else
          echo "::warning::staging_dir/host/bin/ccache 不存在, ccache 可能没有真正启用"
        fi
        echo "----- 产物清单 -----"
        ls -lh bin/targets/*/*/ 2>/dev/null || true
        # x86 Generic 没有 DEVICE_* 项, 该 grep 无匹配是正常的, 不能让步骤失败
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config 2>/dev/null \
          | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME || true
        if [ -s DEVICE_NAME ]; then
          echo "DEVICE_NAME=_$(head -1 DEVICE_NAME)" >> $GITHUB_ENV
        fi
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Verify firmware contains required packages
      run: |
        cd openwrt
        mapfile -t MANIFESTS < <(ls bin/targets/*/*/*.manifest 2>/dev/null)
        if [ "${#MANIFESTS[@]}" -eq 0 ]; then
          echo "::error::找不到 bin/targets 下的 manifest, 无法核对固件内容"
          ls -l bin/targets/*/*/ 2>/dev/null || true
          exit 1
        fi
        echo "核对 manifest: ${MANIFESTS[*]}"
        miss=0
        # 逐个 manifest × 逐个必需包核对: 每个镜像都必须各自包含, 不能"任一文件有就算有"
        for m in "${MANIFESTS[@]}"; do
          echo "--- ${m}"
          for p in ${REQUIRED_PKGS}; do
            # manifest 行格式为 "包名 - 版本"; awk 做整字段匹配避免前缀误判。
            # 注意 kconfig 符号名 != manifest 包名: 带 ABI 版本后缀的库会变成
            # libstdcpp->libstdcpp6 / libuv->libuv1, 所以要额外接受 "<名><数字>" 这种形式。
            hit=$(awk -v n="$p" '
              $2!="-"{next}
              $1==n {print $1" "$3; exit}
              $1 ~ ("^" n "[0-9]+$") {print $1" "$3; exit}
            ' "$m")
            if [ -n "$hit" ]; then
              echo "  有  ${p} -> ${hit}"
            else
              echo "::error::${m} 里没有 ${p} —— 配置里选了但没编进镜像"
              miss=$((miss+1))
            fi
          done
        done
        if [ "$miss" -gt 0 ]; then
          echo "::error::共 ${miss} 处必需包缺失, 该镜像不可用"
          exit 1
        fi
        echo "OK: ${#MANIFESTS[@]} 个 manifest 均含全部必需包"

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    # 为 Save ccache 把关: 目录不存在时先建出来(否则 save 动作会报"path 不存在"),
    # 同时量一下大小 —— 只有真正编过东西(>50MB)才值得占一个缓存配额。
    - name: Inspect ccache
      id: ccache-size
      if: (!cancelled())
      run: |
        mkdir -p "$CCACHE_DIR_WORKSPACE"
        SIZE=$(du -sm "$CCACHE_DIR_WORKSPACE" | cut -f1)
        echo "ccache 目录大小: ${SIZE} MB"
        # 只在真正编过东西(>50MB)时才值得占一个缓存配额; 用显式布尔输出,
        # 不在 if 里做字符串/数字隐式比较。
        if [ "${SIZE:-0}" -ge 50 ]; then WORTH=true; else WORTH=false; fi
        echo "worth=${WORTH}" >> $GITHUB_OUTPUT
        echo "是否保存缓存: ${WORTH} (阈值 50MB)"
        CCACHE_BIN=openwrt/staging_dir/host/bin/ccache
        if [ -x "$CCACHE_BIN" ]; then
          echo "----- ccache 最终统计 -----"
          "$CCACHE_BIN" -s 2>/dev/null | sed -n '1,16p' || true
        fi

    # if: always() 是关键: 编译失败时也要把已生成的缓存存下来, 否则下次重跑仍从零开始。
    - name: Save ccache
      if: always() && !cancelled() && steps.ccache-size.outputs.worth == 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ env.CCACHE_DIR_WORKSPACE }}
        key: ${{ env.CCACHE_KEY }}

    # 失败时把关键信息直接打到日志里, 不必下载 artifact 就能判断原因
    - name: Report build failure
      if: failure()
      run: |
        echo "=========== build.log 尾部 200 行 ==========="
        tail -n 200 openwrt/build.log 2>/dev/null || echo "(build.log 不存在, 说明失败发生在编译之前)"
        echo "=========== bin 目录 ==========="
        ls -l openwrt/bin 2>/dev/null || echo "(bin 不存在: 编译未完成)"
        echo "=========== 磁盘 ==========="
        df -hT /

    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: build-log-${{ env.REPO_NAME }}-${{ github.run_id }}
        path: |
          openwrt/build.log
          openwrt/.config
        if-no-files-found: ignore

    - name: Upload bin directory
      uses: actions/upload-artifact@v7
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
      run: |
        # 不用 cd 通配符: 目录不存在时给出可读的报错, 而不是 No such file or directory
        TARGET_DIR=$(echo openwrt/bin/targets/*/* | cut -d' ' -f1)
        if [ ! -d "$TARGET_DIR" ]; then
          echo "::error::未找到固件输出目录, 编译未产出镜像"
          ls -R openwrt/bin 2>/dev/null | head -50 || echo "(bin 不存在)"
          exit 1
        fi
        cd "$TARGET_DIR"
        rm -rf packages
        ls -lh
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@v7
      if: steps.organize.outputs.status == 'success'
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
      run: |
        echo "release_tag=GXT-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        {
          echo "【GXT】固件不含 luci-app-unblockneteasemusic 与 node。"
          echo ""
          echo "- LEDE commit: \`${LEDE_COMMIT}\`"
          echo ""
          echo "配套的网易云解锁 ipk(v3.4, 与 MJ 通用)请在 Build UNM ipk (standalone) 中使用同一 commit 构建。"
        } > release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v3
      if: steps.tag.outputs.status == 'success'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Delete old workflow runs
      if: steps.tag.outputs.status == 'success'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh run list --workflow x86_lean_GXT.yml --limit 60 \
          --json databaseId --jq '.[].databaseId' \
          | tail -n +3 \
          | while read -r id; do gh run delete "$id" || true; done

    - name: Remove old GXT releases
      if: steps.tag.outputs.status == 'success'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release list --limit 100 --json tagName --jq '.[].tagName' \
          | grep '^GXT-' | sort -r | tail -n +4 \
          | while read -r tag; do
              [ -n "$tag" ] && gh release delete "$tag" --yes --cleanup-tag
            done

