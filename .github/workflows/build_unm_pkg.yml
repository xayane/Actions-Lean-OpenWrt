#=================================================
# 基于 https://github.com/xayane/Actions-Lean-OpenWrt 调整
# 用途: 单独编译 luci-app-unblockneteasemusic(JS 版) 及其运行时依赖 node, 产出 ipk
#
# 插件来源: LEDE luci feed 自带版本(v3.4, nftset + firewall4)。
#   MJ 与 GXT 两台已统一到该版本, 因此只需跑一次:
#     - 插件本体 LUCI_PKGARCH:=all, 与架构无关;
#     - node 的 ipk 两台同架构(x86_64)通用。
#
# lede_commit 必须与对应固件构建使用的 commit 一致, 否则 node 链接的
# libc/libstdc++/openssl 版本可能与固件不匹配, opkg 会报符号缺失。
#=================================================

name: Build UNM ipk (standalone)

on:
  workflow_dispatch:
    inputs:
      lede_commit:
        description: "LEDE commit: 40 位或短哈希均可, 建议填固件构建用的; 留空=分支 HEAD"
        required: false
        default: ""

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: unm/unm.config
  UNM_PKG: luci-app-unblockneteasemusic
  TZ: Asia/Shanghai
  CCACHE_DIR_WORKSPACE: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 40G

permissions:
  contents: read

concurrency:
  group: unm-ipk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-26.04

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Show runner environment
      run: |
        . /etc/os-release
        echo "########## runner ##########"
        echo "image       : ${PRETTY_NAME} (VERSION_ID=${VERSION_ID})"
        echo "kernel      : $(uname -r)"
        echo "glibc       : $(ldd --version | head -1 | awk '{print $NF}')"
        echo "cpu         : $(nproc) 核 / $(lscpu | awk -F: '/Model name/{gsub(/^ +| +$/,"",$2); print $2; exit}')"
        echo "memory      : $(free -h | awk '/^Mem:/{print $2}')"
        echo "disk (root) : $(df -hT / | awk 'NR==2{print $4" 可用 / 共 "$3}')"
        echo "python3     : $(python3 -V 2>&1)"
        echo "gcc         : $(gcc --version | head -1)"
        echo "########## apt 源 ##########"
        ls -1 /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
        # 24.04 起默认源是 deb822 格式(ubuntu.sources 里的 Types: deb),
        # 老格式是 sources.list / *.list 里的 deb 行, 两种都要认。
        # 注意只把"确实存在的文件"交给 grep: grep 遇到不存在的文件会返回 2,
        # 在 `if ! grep` 里会被误判成"没有源"。
        srcs=""
        if [ -f /etc/apt/sources.list ]; then srcs="$srcs /etc/apt/sources.list"; fi
        for f in /etc/apt/sources.list.d/*; do
          if [ -f "$f" ]; then srcs="$srcs $f"; fi
        done
        if [ -z "$srcs" ]; then
          echo "::error::runner 上不存在任何 apt 源文件, 后续依赖装不上"
          exit 1
        fi
        if ! grep -hsE '^(deb|Types:)' $srcs >/dev/null 2>&1; then
          echo "::error::apt 源文件里没有有效的 deb / Types: 行, 后续依赖装不上"
          exit 1
        fi
        echo "OK: apt 源存在 ($(echo $srcs | wc -w) 个文件)"

    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        preinstalled-runtimes: true
        docker-images: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: true

    - name: Install build dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -o pipefail
        . /etc/os-release
        echo "镜像: ${PRETTY_NAME} (VERSION_ID=${VERSION_ID})"

        sudo -E apt-get update -qq || { echo "::error::apt update 失败, 检查 runner 的 apt 源与网络"; exit 1; }

        has_pkg() { apt-cache show "$1" >/dev/null 2>&1; }
        pick() {
          for p in "$@"; do
            if has_pkg "$p"; then printf '%s' "$p"; return 0; fi
          done
          return 1
        }

        NCURSES="$(pick libncurses-dev libncurses5-dev || true)"
        NCURSESW="$(pick libncursesw-dev libncursesw5-dev || true)"
        if [ -n "$NCURSES" ]; then
          echo "ncurses 头文件包: $NCURSES"
        else
          echo "::error::当前镜像找不到 ncurses 开发包(libncurses-dev 与 libncurses5-dev 都不存在)"
          exit 1
        fi
        [ -n "$NCURSESW" ] && echo "ncursesw 头文件包: $NCURSESW (可缺省)"

        MUST="build-essential gcc-multilib g++-multilib autoconf automake libtool
              binutils bison flex gawk gettext pkgconf cmake ninja-build patch cpio
              rsync wget curl git unzip bzip2 xz-utils zlib1g-dev libssl-dev
              libelf-dev libltdl-dev libmpc-dev libmpfr-dev libgmp3-dev libreadline-dev
              libpython3-dev python3 python3-setuptools python3-pyelftools texinfo
              subversion swig squashfs-tools scons device-tree-compiler qemu-utils
              upx-ucl libglib2.0-dev libfuse-dev ccache"

        # 只在完整固件编译或个别插件里用到, 缺了不影响 node/UNM, 降级为告警。
        OPT="ack antlr3 asciidoc autopoint clang llvm genisoimage gperf haveged help2man
             intltool libc6-dev-i386 lrzsz msmtp p7zip p7zip-full uglifyjs vim xmlto xxd"

        must_list=""; must_missing=""
        for p in $MUST; do
          if has_pkg "$p"; then must_list="$must_list $p"; else must_missing="$must_missing $p"; fi
        done
        must_list="$must_list $NCURSES"
        [ -n "$NCURSESW" ] && must_list="$must_list $NCURSESW"

        if [ -n "$must_missing" ]; then
          echo "::error::以下必需依赖在 ${PRETTY_NAME} 中不存在:${must_missing}"
          echo "::error::说明 runner 换了发行版, 需要更新本步骤 MUST 列表的包名映射"
          exit 1
        fi

        echo "安装必需依赖: $(echo $must_list | wc -w) 个"
        sudo -E apt-get -y install $must_list || { echo "::error::必需依赖安装失败"; exit 1; }

        opt_list=""; opt_missing=""
        for p in $OPT; do
          if has_pkg "$p"; then opt_list="$opt_list $p"; else opt_missing="$opt_missing $p"; fi
        done

        # 先整批装; 失败再逐个重试, 把真正装不上的挑出来, 不让单个包拖垮整步
        if [ -n "$opt_list" ]; then
          if ! sudo -E apt-get -y install $opt_list >/dev/null 2>&1; then
            echo "::warning::可选依赖整批安装失败, 改为逐个安装定位"
            for p in $opt_list; do
              sudo -E apt-get -y install "$p" >/dev/null 2>&1 || opt_missing="$opt_missing $p"
            done
          fi
        fi
        if [ -n "$opt_missing" ]; then
          echo "::warning::以下可选依赖在本镜像不可用(不影响 node/UNM 编译):${opt_missing}"
        fi

        if has_pkg python3-distutils; then
          sudo -E apt-get -y install python3-distutils >/dev/null 2>&1 && echo "已装 python3-distutils"
        elif python3 -c 'import setuptools' >/dev/null 2>&1; then
          echo "distutils 由 setuptools 提供(现代源码已不依赖独立的 distutils 包)"
        else
          echo "::warning::python3-distutils 不可用且 setuptools 缺失, 旧构建脚本可能报 No module named 'distutils'"
        fi

        sudo timedatectl set-timezone "$TZ" || echo "::warning::设置时区失败(容器环境常见), 不影响构建"

        echo "########## 关键工具版本 ##########"
        for c in gcc g++ make ccache python3 perl rsync; do
          printf '%-8s %s\n' "$c" "$(command -v $c >/dev/null 2>&1 && $c --version 2>&1 | head -1 || echo 缺失)"
        done
        df -hT /

    - name: Clone LEDE
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RAW_COMMIT: ${{ inputs.lede_commit }}
      run: |
        git clone --depth 1 --branch "$REPO_BRANCH" --single-branch "$REPO_URL" openwrt
        cd openwrt

        # 去掉手抖带进来的空格/换行
        RAW="$(printf '%s' "$RAW_COMMIT" | tr -d '[:space:]')"

        if [ -z "$RAW" ]; then
          echo "::warning::lede_commit 未填写, 本次使用 ${REPO_BRANCH} 当前 HEAD"
          echo "::warning::若它与固件构建时的 commit 不同, node 链的 libstdc++/libssl 可能对不上, 路由器上会报符号缺失"
          echo "LEDE_PINNED=no" >> $GITHUB_ENV
        else
          # 只接受 7-40 位十六进制。路由器 /etc/openwrt_release 里
          # DISTRIB_REVISION='r28000-abc1234' 末尾那串短哈希也可以直接填。
          case "$RAW" in
            *[!0-9a-fA-F]*) echo "::error::lede_commit 含非十六进制字符: $RAW"; exit 1 ;;
          esac
          [ "${#RAW}" -ge 7 ] || { echo "::error::lede_commit 太短(${#RAW} 位), 至少 7 位"; exit 1; }

          FULL=""
          if [ "${#RAW}" -eq 40 ]; then
            FULL="$RAW"
          else
            # 注意: GitHub API 不支持用短哈希查 commit(会直接返回 "No commit found for SHA"),
            # 所以在分支历史里按前缀匹配。固件是新近构建的, 最近 500 个 commit 足够覆盖。
            page=1
            while [ "$page" -le 5 ] && [ -z "$FULL" ]; do
              list="$(gh api "repos/coolsnowwolf/lede/commits?sha=${REPO_BRANCH}&per_page=100&page=${page}" --jq '.[].sha' 2>/dev/null || true)"
              for s in $list; do
                case "$s" in
                  "$RAW"*) FULL="$s"; break ;;
                esac
              done
              page=$((page + 1))
            done
            if [ -z "$FULL" ]; then
              echo "::error::在 ${REPO_BRANCH} 最近 500 个 commit 里找不到 $RAW"
              echo "::error::请到固件 workflow 运行页 Summary 复制完整 40 位 commit 再试"
              exit 1
            fi
            echo "短哈希 ${RAW} -> 完整 ${FULL}"
          fi

          # 优先只取这一个 commit; 服务器不允许按 sha 取时逐级加深
          git fetch --depth 1 origin "$FULL" 2>/dev/null \
            || git fetch --depth 500 origin "$REPO_BRANCH" 2>/dev/null \
            || git fetch origin
          git checkout -q "$FULL"
          GOT="$(git rev-parse HEAD)"
          if [ "$GOT" != "$FULL" ]; then
            echo "::error::checkout 后 HEAD($GOT) 与请求的 commit($FULL) 不一致"; exit 1
          fi
          echo "已固定到固件侧 commit: $GOT"
          echo "LEDE_PINNED=yes" >> $GITHUB_ENV
        fi

        echo "LEDE_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV
        echo "SHORT_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        git log -1 --format='LEDE commit: %H%n提交日期: %ci%n标题: %s'

    # ── 构建缓存 ────────────────────────────────────────────────────────────
    # 两段缓存的取舍不同, 分开设计是为了控制"复用旧产物导致结果错误"的风险:
    #
    # 1) dl/ —— LEDE 下载的源码包。每个 tarball 都带哈希校验, 复用不影响正确性,
    #    所以用 restore-keys 前缀命中: 即使换了 commit, 也能吃到已下载的那部分,
    #    省掉 1-2 GB 的网络下载。
    # 2) 宿主工具链(host 工具 + 交叉工具链) —— 与 commit 强绑定(gcc/binutils 版本
    #    由 commit 决定), 因此**只设精确 key、不设 restore-keys**, 绝不复用别的 commit
    #    的产物。它只在"同一 commit 重跑"时命中, 而这恰好是最需要救的场景:
    #    上次跑到第 60 分钟失败, 重跑时不必再花 20-40 分钟重编工具链。
    #    必须 staging_dir 与 build_dir 成对缓存: make 判断"是否已编译"看的是
    #    build_dir 里的 stamp, 只恢复 staging_dir 的话它照样从头再编一遍, 等于没缓存。
    #    目标侧(target-*)不缓存: 它与 .config 的包选择耦合, 恢复半套会造出不一致的构建树。
    #    actions/cache 的保存动作是 post-if: success(), 失败运行不会写入缓存。
    - name: Restore source package cache (dl)
      id: dl-cache
      uses: actions/cache@v6
      with:
        path: openwrt/dl
        key: unm-dl-${{ env.REPO_BRANCH }}-${{ env.LEDE_COMMIT }}
        restore-keys: |
          unm-dl-${{ env.REPO_BRANCH }}-
          unm-dl-

    - name: Restore host toolchain cache (same commit only)
      id: host-cache
      uses: actions/cache@v6
      with:
        path: |
          openwrt/staging_dir/host
          openwrt/staging_dir/toolchain-*
          openwrt/build_dir/host
          openwrt/build_dir/toolchain-*
        key: unm-host-${{ env.LEDE_COMMIT }}-${{ hashFiles('unm/unm.config') }}

    # ccache 键: 精确 key 带 run_id(缓存条目不可覆盖, 固定 key 会让第二次之后不再写入新内容),
    # restore-keys 逐级放宽到同分支任意 commit —— ccache 条目内容寻址, 跨 commit 复用安全。
    # 指纹用 unm/unm.config(本 workflow 的意图配置)与自身 workflow 文件。
    - name: Compute ccache key
      run: |
        FINGERPRINT=$(sha256sum "$CONFIG_FILE" .github/workflows/build_unm_pkg.yml \
          | sha256sum | cut -c1-12)
        PREFIX="ccache-unm-${LEDE_COMMIT}"
        {
          echo "CCACHE_KEY_PREFIX=${PREFIX}"
          echo "CCACHE_KEY=${PREFIX}-${FINGERPRINT}-${GITHUB_RUN_ID}"
        } >> $GITHUB_ENV
        echo "配置指纹  : ${FINGERPRINT}"
        echo "ccache 键 : ${PREFIX}-${FINGERPRINT}-${GITHUB_RUN_ID}"

    - name: Restore ccache
      id: ccache
      uses: actions/cache/restore@v6
      with:
        path: ${{ env.CCACHE_DIR_WORKSPACE }}
        key: ${{ env.CCACHE_KEY }}
        restore-keys: |
          ${{ env.CCACHE_KEY_PREFIX }}-
          ccache-unm-

    - name: Report cache status
      run: |
        echo "dl 缓存命中        : ${{ steps.dl-cache.outputs.cache-hit }}"
        echo "宿主工具链缓存命中 : ${{ steps.host-cache.outputs.cache-hit }}"
        echo "ccache 缓存命中    : ${{ steps.ccache.outputs.cache-hit }}"
        for d in openwrt/dl openwrt/staging_dir openwrt/build_dir "$CCACHE_DIR_WORKSPACE"; do
          if [ -d "$d" ]; then
            printf '%-40s %s\n' "$d" "$(du -sh "$d" | cut -f1)"
          else
            printf '%-40s %s\n' "$d" "空"
          fi
        done
        # 标准 runner 只有 14 GB 磁盘, 缓存 + 编译产物很容易吃满。
        avail=$(df -Pk / | awk 'NR==2{print int($4/1024)}')
        echo "根分区可用         : ${avail} MB"
        if [ "${avail:-0}" -lt 6000 ]; then
          echo "::warning::可用磁盘仅 ${avail} MB, 完整编译可能中途写满; 若真失败, 可临时注释掉 dl 缓存那一步"
        fi

    - name: Update and install feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Check UNM package in feed
      run: |
        cd openwrt
        PKG_DIR="package/feeds/luci/${UNM_PKG}"
        [ -e "$PKG_DIR/Makefile" ] || {
          echo "::error::luci feed 中找不到 ${UNM_PKG}, 请检查 feeds.conf.default 的 luci 分支"
          exit 1
        }
        # feed 版 Makefile 用相对路径 include ../../luci.mk,
        # 因此必须是 feeds 的符号链接形态; 若被替换成真实目录会报找不到 luci.mk
        if [ -L "$PKG_DIR" ]; then
          echo "OK: ${PKG_DIR} 是符号链接(相对 include 可用)"
        else
          echo "::warning::${PKG_DIR} 不是符号链接, 若编译时报找不到 luci.mk 请检查是否被 clone 覆盖"
        fi
        echo "----- 待编译版本 -----"
        grep -E '^(PKG_VERSION|PKG_RELEASE|LUCI_TITLE|LUCI_DEPENDS)' \
          "$PKG_DIR/Makefile" | tee /tmp/unm-meta.txt
        grep -q 'JavaScript' "$PKG_DIR/Makefile" \
          || echo "::warning::标题不含 JavaScript, 可能不是预期的 JS 版插件"
        # 确认分流实现是 fw4 的 nftset 模板(而非旧的 ipset)
        if grep -q 'nftables.ut' "$PKG_DIR/root/etc/init.d/${UNM_PKG#luci-app-}"; then
          echo "分流实现: nftset (fw4)"
        else
          echo "::warning::未在 init.d 中检测到 nftables.ut, 分流路径可能与预期不同"
        fi
        UNM_VER="$(sed -n 's/^PKG_VERSION:=//p' /tmp/unm-meta.txt | head -1)"
        [ -n "$UNM_VER" ] || UNM_VER="unknown"
        echo "UNM_VER=${UNM_VER}" >> $GITHUB_ENV

    - name: Apply config
      run: |
        cd openwrt
        cp "$GITHUB_WORKSPACE/$CONFIG_FILE" .config
        # 仓库里的 unm.config 在 Windows 上编辑过会是 CRLF; kconfig 自己能剥掉 \r,
        # 但这里顺手归一化, 免得后续比较/排查时被行尾差异干扰
        sed -i 's/\r$//' .config
        echo "----- 喂给 defconfig 的关键行 -----"
        grep -E '^CONFIG_(TARGET|PACKAGE_node|PACKAGE_luci-app-unblockneteasemusic)' .config || true
        make defconfig

    - name: Verify configuration
      run: |
        cd openwrt
        echo "########## .config 行数: $(wc -l < .config)"
        echo "########## 生效的 target / arch ##########"
        grep -E '^CONFIG_(TARGET|ARCH|BUILD_)' .config || true
        echo "########## 关键包 ##########"
        grep -E "^CONFIG_PACKAGE_(node|${UNM_PKG}|firewall4|nftables-json|ucode|dnsmasq-full)=" .config || true
        echo "########## node 相关选项 ##########"
        grep -E '^CONFIG_NODEJS' .config || true

        fail=0
        # node 的 ABI 只由 board + subtarget 决定(它们决定 ARCH、工具链、libc/libstdc++/libssl),
        # profile 只影响镜像打包与 DEFAULT_PACKAGES, 单包编译不需要它。
        # 所以硬断言只落在 board/subtarget 上。
        grep -qE '^CONFIG_TARGET_x86=y' .config \
          || { echo "::error::board 未选中: CONFIG_TARGET_x86 缺失"; fail=1; }
        grep -qE '^CONFIG_TARGET_x86_64=y' .config \
          || { echo "::error::subtarget 未选中: CONFIG_TARGET_x86_64 缺失"; fail=1; }

        # profile 的符号名随源码版本变过:
        #   旧版 target/linux/x86/64/target.mk 有 `define Profile/Generic` -> CONFIG_TARGET_x86_64_Generic
        #   新版只剩 image/64.mk 的 `define Device/generic` + TARGET_DEVICES -> CONFIG_TARGET_x86_64_DEVICE_generic
        # 当前 LEDE master 的 target.mk 里已经没有 Profile/Generic, 所以只断言 Generic 必然失败。
        # 这里按"三选一命中即可, 但一个 profile 都没有就真错了"来判。
        if grep -qE '^CONFIG_TARGET_x86_64_(Generic|DEVICE_generic)=y' .config; then
          echo "OK: x86_64 的 Generic profile 已选中"
        elif grep -qE '^CONFIG_TARGET_x86_64_[A-Za-z0-9_]+=y' .config; then
          echo "::warning::profile 符号与预期不同, 实际为:"
          grep -E '^CONFIG_TARGET_x86_64_[A-Za-z0-9_]+=y' .config | head -5
        else
          echo "::error::x86_64 下没有任何 profile 被选中, defconfig 可能把 target 整体丢了"
          fail=1
        fi

        for sym in "PACKAGE_${UNM_PKG}" PACKAGE_node PACKAGE_firewall4; do
          grep -qE "^CONFIG_${sym}=y" .config || { echo "::error::${sym} 未选中"; fail=1; }
        done

        [ $fail -eq 0 ] || exit 1
        echo "OK: 配置校验通过(board/subtarget 与关键包均已就位)"

    - name: Resolve package build targets
      run: |
        cd openwrt

        # 注意: tmp/.packageinfo 里 Source-Makefile 排在 Package: 之前, 必须先缓存再匹配
        # 返回的是 repo 根相对路径, 形如 package/feeds/packages/node
        resolve_src() {
          awk -v want="$1" '
            /^Source-Makefile: / { p = $2; sub(/\/Makefile$/, "", p) }
            /^Package: / && $2 == want { print p; exit }
          ' tmp/.packageinfo
        }

        # 剥掉开头的 package/, 得到相对 package/ 的目录名(与 .packagedeps 里的写法一致)
        strip_prefix() {
          case "$1" in
            package/*) printf '%s\n' "${1#package/}" ;;
            *)         printf '%s\n' "$1" ;;
          esac
        }

        # 已注册的 builddir 集合: package-y/package- 右侧, 以及 $(curdir)/xxx/compile 左侧
        if [ -f tmp/.packagedeps ]; then
          # 两种写法都要归一化成"无前导斜杠的相对目录"
          #   package-y += feeds/packages/node
          #   $(curdir)/feeds/packages/node/compile += ...
          sed -n -e 's/^package-[ym]* += //p' -e 's/^\$(curdir)\(.*\)\/compile += .*/\1/p' \
            -e 's/^\$(curdir)\(.*\)\/compile:.*/\1/p' tmp/.packagedeps \
            | tr ' ' '\n' | sed -e 's|^/||' -e '/^$/d' | sort -u > /tmp/registered-dirs.txt
          echo "tmp/.packagedeps 里已注册的 builddir: $(wc -l < /tmp/registered-dirs.txt) 个"
        else
          : > /tmp/registered-dirs.txt
          echo "::warning::tmp/.packagedeps 不存在, 跳过 builddir 注册性校验"
        fi

        fail=0
        for name in node "$UNM_PKG"; do
          src="$(resolve_src "$name")"
          if [ -z "$src" ]; then
            echo "::error::${name} 在 tmp/.packageinfo 里查不到源码目录, 该包可能没被 feeds install 进来"
            fail=1
            continue
          fi
          rel="$(strip_prefix "$src")"
          if [ ! -f "package/${rel}/Makefile" ]; then
            echo "::error::${name} 的源码目录 package/${rel} 下没有 Makefile"
            fail=1
            continue
          fi
          echo "${name}: Source-Makefile=${src} -> 相对目录 ${rel}  (PKG_VERSION=$(sed -n 's/^PKG_VERSION:=//p' "package/${rel}/Makefile" | head -1))"
        done
        [ $fail -eq 0 ] || exit 1

        # 拼目标并在 .packagedeps 里核对是否真的注册了
        # 注意: 本函数用 $( ) 捕获返回值, 所有诊断信息必须走 stderr, 否则会污染目标名
        make_goal() {
          local name="$1" rel goal
          rel="$(strip_prefix "$(resolve_src "$name")")"
          goal="package/${rel}/compile"
          if [ -s /tmp/registered-dirs.txt ] && ! grep -qxF "$rel" /tmp/registered-dirs.txt; then
            {
              echo "::warning::${rel} 不在 tmp/.packagedeps 的 builddir 列表里, 目标 ${goal} 可能不被识别"
              echo "           同名候选: $(grep -F "/$(basename "$rel")" /tmp/registered-dirs.txt | head -5 | tr '\n' ' ')"
            } >&2
          fi
          printf '%s\n' "$goal"
        }

        NODE_GOAL="$(make_goal node)"
        UNM_GOAL="$(make_goal "$UNM_PKG")"
        # 双 package/ 前缀是最容易犯的错, 出现就立即失败, 不要等到 40 分钟后再报
        case "$NODE_GOAL$UNM_GOAL" in
          *package/package/*)
            echo "::error::目标名出现重复的 package/ 前缀: $NODE_GOAL / $UNM_GOAL"
            exit 1
            ;;
        esac
        echo "NODE_GOAL=$NODE_GOAL" >> $GITHUB_ENV
        echo "UNM_GOAL=$UNM_GOAL" >> $GITHUB_ENV
        echo "node -> $NODE_GOAL"
        echo "unm  -> $UNM_GOAL"

        # 备用目标: include/subdir.mk 的 diralias 会为每个 builddir 额外注册
        # package/<目录名>/compile(如 package/node/compile)。第六次运行的日志已证明这种写法可用,
        # 只是在同名目录冲突时会指向不确定的那个, 所以只作为主目标失败后的兜底。
        NODE_REL="$(strip_prefix "$(resolve_src node)")"
        UNM_REL="$(strip_prefix "$(resolve_src "$UNM_PKG")")"
        echo "NODE_GOAL_ALT=package/$(basename "$NODE_REL")/compile" >> $GITHUB_ENV
        echo "UNM_GOAL_ALT=package/$(basename "$UNM_REL")/compile" >> $GITHUB_ENV
        echo "node 备用 -> package/$(basename "$NODE_REL")/compile"
        echo "unm  备用 -> package/$(basename "$UNM_REL")/compile"

        # 诊断: 把 node 的编译依赖列表打出来, 并标出有没有 kernel/linux。
        # tmp/.packagedeps 是 makefile 片段, 路径写成字面量 $(curdir)/<相对目录>/compile
        if [ -f tmp/.packagedeps ]; then
          DEPS="$(grep -F "\$(curdir)/${NODE_REL}/compile" tmp/.packagedeps | head -1 || true)"
          DEPS="${DEPS#*= }"   # 去掉 "目标 +=" 前缀, 只留右侧依赖
          echo "--- node 的编译依赖(tmp/.packagedeps) ---"
          echo "$DEPS" | tr ' ' '\n' | grep -F '$(curdir)/' \
            | sed 's|.*\$(curdir)/||; s|/compile$||' | sed 's/^/  /' | head -30 || true
          if echo "$DEPS" | grep -q 'kernel/linux'; then
            echo "=> 依赖里含 kernel/linux: 必须先编内核, 否则 kmod 打包会失败"
          else
            echo "=> 依赖里没有 kernel/linux: 内核步骤属预防性构建"
          fi
        fi

    - name: Build tools and toolchain
      run: |
        cd openwrt
        # ccache: 命令行变量, 见 env 段注释。第一次会先编 tools/ccache(4.10.2) 再编其余工具。
        CCACHE_OPTS="CONFIG_CCACHE=y CONFIG_CCACHE_DIR=$CCACHE_DIR_WORKSPACE"
        mkdir -p "$CCACHE_DIR_WORKSPACE"
        echo "ccache 目录: $CCACHE_DIR_WORKSPACE (上限 $CCACHE_MAXSIZE)"
        make tools/install -j$(nproc) $CCACHE_OPTS || make tools/install -j1 $CCACHE_OPTS
        make toolchain/install -j$(nproc) $CCACHE_OPTS || make toolchain/install -j1 $CCACHE_OPTS

    - name: Build kernel for target
      run: |
        cd openwrt
        echo "开始编译内核(为 kmod 打包提供 .ko), 预计 20-30 分钟"
        START=$(date +%s)
        CCACHE_OPTS="CONFIG_CCACHE=y CONFIG_CCACHE_DIR=$CCACHE_DIR_WORKSPACE"
        make target/linux/compile -j$(nproc) V=s $CCACHE_OPTS > /tmp/kernel-build.log 2>&1 \
          || make target/linux/compile -j1 V=s $CCACHE_OPTS >> /tmp/kernel-build.log 2>&1 \
          || {
            echo "::error::内核编译失败, 尾部错误行:"
            grep -nE 'Error [0-9]+|\*\*\*|error:' /tmp/kernel-build.log | tail -5 \
              | while IFS= read -r line; do echo "::error::${line:0:900}"; done
            tail -40 /tmp/kernel-build.log
            exit 1
          }
        echo "内核编译耗时: $(( $(date +%s) - START )) 秒"

        # 自证: 内核配置与 modules.builtin 必须存在, 否则 kmod 打包一定失败
        KBUILD_DIR=$(ls -d build_dir/target-*/linux-*/linux-[0-9]* 2>/dev/null | head -1)
        echo "内核源码目录: ${KBUILD_DIR:-<未找到>}"
        if [ -z "$KBUILD_DIR" ] || [ ! -f "$KBUILD_DIR/.config" ]; then
          echo "::error::内核 .config 未生成, 后续 kmod 打包必然失败"
          exit 1
        fi
        echo "OK: 内核已就绪, .ko 数量 = $(find "$KBUILD_DIR" -name '*.ko' | wc -l)"

    - name: Compile node runtime
      run: |
        cd openwrt
        # runner 实际用的是 `/usr/bin/bash -e {0}`(日志可查), 默认**没有** pipefail,
        # 于是 `make | tee` 的 $? 是 tee 的 0, make 失败会被吞掉 —— 第七次运行就是这样:
        # 本步报 Error 2 却仍继续执行, 一直到 Collect ipk 才以 "bin/packages 不存在" 失败。
        set -o pipefail
        LOG=/tmp/node-build.log
        GOAL="$NODE_GOAL"
        CCACHE_OPTS="CONFIG_CCACHE=y CONFIG_CCACHE_DIR=$CCACHE_DIR_WORKSPACE"
        echo "目标: $GOAL"
        set +e
        make "$GOAL" V=s -j$(nproc) $CCACHE_OPTS 2>&1 | tee "$LOG"
        rc=$?
        # 主目标若未被 make 识别, 自动退到 include/subdir.mk 的目录别名目标再试一次
        if [ $rc -ne 0 ] && grep -qF 'No rule to make target' "$LOG"; then
          echo "::warning::主目标 $GOAL 未被识别, 改用目录别名目标 ${NODE_GOAL_ALT}"
          GOAL="$NODE_GOAL_ALT"
          make "$GOAL" V=s -j$(nproc) $CCACHE_OPTS 2>&1 | tee "$LOG"
          rc=$?
        fi
        if [ $rc -ne 0 ]; then
          echo "::warning::并行编译失败(rc=$rc), 改用 -j1 重试以取得确定的错误位置"
          make "$GOAL" V=s -j1 $CCACHE_OPTS 2>&1 | tee -a "$LOG"
          rc=$?
        fi
        set -e
        if [ $rc -ne 0 ]; then
          echo "::error::node 编译失败 (rc=$rc), 目标 $GOAL"
          grep -nE 'No rule to make target|toplevel\.mk:[0-9]+|is missing|failed to build|Error [0-9]+|\*\*\*' "$LOG" \
            | tail -5 | while IFS= read -r line; do
                echo "::error::${line:0:900}"
              done
          exit 1
        fi

    - name: Compile luci-app-unblockneteasemusic
      run: |
        cd openwrt
        set -o pipefail
        LOG=/tmp/unm-build.log
        GOAL="$UNM_GOAL"
        CCACHE_OPTS="CONFIG_CCACHE=y CONFIG_CCACHE_DIR=$CCACHE_DIR_WORKSPACE"
        echo "目标: $GOAL"
        set +e
        make "$GOAL" V=s -j$(nproc) $CCACHE_OPTS 2>&1 | tee "$LOG"
        rc=$?
        if [ $rc -ne 0 ] && grep -qF 'No rule to make target' "$LOG"; then
          echo "::warning::主目标 $GOAL 未被识别, 改用目录别名目标 ${UNM_GOAL_ALT}"
          GOAL="$UNM_GOAL_ALT"
          make "$GOAL" V=s -j$(nproc) $CCACHE_OPTS 2>&1 | tee "$LOG"
          rc=$?
        fi
        if [ $rc -ne 0 ]; then
          echo "::warning::并行编译失败(rc=$rc), 改用 -j1 重试"
          make "$GOAL" V=s -j1 $CCACHE_OPTS 2>&1 | tee -a "$LOG"
          rc=$?
        fi
        set -e
        if [ $rc -ne 0 ]; then
          echo "::error::${UNM_PKG} 编译失败 (rc=$rc), 目标 $GOAL"
          grep -nE 'No rule to make target|toplevel\.mk:[0-9]+|is missing|failed to build|Error [0-9]+|\*\*\*' "$LOG" \
            | tail -5 | while IFS= read -r line; do
                echo "::error::${line:0:900}"
              done
          exit 1
        fi

    # ccache 的成败要看命中的绝对值, 所以把统计直接打到日志里, 不依赖本地复现。
    - name: Inspect ccache
      id: ccache-size
      if: always() && !cancelled()
      run: |
        mkdir -p "$CCACHE_DIR_WORKSPACE"
        SIZE=$(du -sm "$CCACHE_DIR_WORKSPACE" | cut -f1)
        echo "ccache 目录大小: ${SIZE} MB"
        # 只在真正编过东西(>50MB)时才值得占一个缓存配额; 用显式布尔输出,
        # 不在 if 里做字符串/数字隐式比较。
        if [ "${SIZE:-0}" -ge 50 ]; then WORTH=true; else WORTH=false; fi
        echo "worth=${WORTH}" >> $GITHUB_OUTPUT
        echo "是否保存缓存: ${WORTH} (阈值 50MB)"
        CCACHE_BIN=openwrt/staging_dir/host/bin/ccache
        if [ -x "$CCACHE_BIN" ]; then
          echo "----- ccache 统计 -----"
          LC_ALL=C "$CCACHE_BIN" -s 2>/dev/null | sed -n '1,20p' || true
        else
          echo "::warning::staging_dir/host/bin/ccache 不存在, ccache 可能没有真正启用"
        fi

    # if: always() 是关键: 本 workflow 历史上多次在中途失败, 失败时也存缓存,
    # 下次重跑才能跳过已编过的工具链/内核。
    - name: Save ccache
      if: always() && !cancelled() && steps.ccache-size.outputs.worth == 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ env.CCACHE_DIR_WORKSPACE }}
        key: ${{ env.CCACHE_KEY }}

    - name: Collect ipk and inspect control data
      run: |
        cd openwrt
        if [ ! -d bin/packages ]; then
          echo "::error::bin/packages 不存在, 说明前面的编译步骤没有产出任何 ipk"
          echo "--- bin/ 下的实际内容 ---"
          ls -la bin 2>/dev/null || echo "(bin/ 也不存在)"
          echo "--- 各包 stamp 状态 ---"
          ls -la build_dir/target-*/stamp 2>/dev/null | head -20 || echo "(无 stamp 目录)"
          exit 1
        fi
        mkdir -p out
        found=$(find bin/packages -name '*.ipk' | wc -l)
        echo "找到 ipk: ${found} 个"
        if [ "$found" -eq 0 ]; then
          echo "::error::bin/packages 下没有任何 .ipk"
          find bin/packages -maxdepth 4 -type d | head -20
          exit 1
        fi
        find bin/packages -name '*.ipk' -exec cp -f {} out/ \;
        cd out
        ls -lh
        echo "=========== 各包 Depends ==========="
        for f in *.ipk; do
          echo "=== $f"
          ar p "$f" control.tar.gz 2>/dev/null | tar -xzO ./control 2>/dev/null | sed -n '1,15p' || echo "(无法解析)"
        done
        sha256sum *.ipk > SHA256SUMS
        du -sh .

    - name: Upload ipk artifact
      uses: actions/upload-artifact@v7
      with:
        name: unm-ipk-v${{ env.UNM_VER }}-${{ env.SHORT_COMMIT }}
        path: |
          openwrt/out
          openwrt/bin/packages/x86_64
        if-no-files-found: error

    - name: Write build summary
      run: |
        {
          echo "## UNM ipk 构建完成(MJ / GXT 通用)"
          echo ""
          echo "- 插件版本: \`v${UNM_VER}\`(LEDE luci feed, JS 版)"
          echo "- 分流机制: nftset + firewall4"
          if [ "${LEDE_PINNED}" = "yes" ]; then
            echo "- LEDE commit: \`${LEDE_COMMIT}\`(已按输入固定)"
          else
            echo "- LEDE commit: \`${LEDE_COMMIT}\` **未固定**, 用的是分支 HEAD"
            echo ""
            echo "> 若与固件构建时的 commit 不同, node 的运行时依赖可能对不上。"
            echo "> 请带 \`lede_commit\` 重跑一次, 值取固件 workflow 运行页 Summary 里的那串。"
          fi
          echo "- runner 镜像: ubuntu-26.04(公共预览)"
          echo "- 缓存: \`dl\`=${{ steps.dl-cache.outputs.cache-hit }} / 宿主工具链=${{ steps.host-cache.outputs.cache-hit }}"
          echo ""
          echo "插件本体为 \`PKGARCH:=all\`,node 为 x86_64;两台路由器同一份 ipk 通用。"
          echo ""
          echo "安装前确认路由器侧:"
          echo "- \`fw4\` 在跑: \`fw4 -v\` 或 \`nft list ruleset | head\`"
          echo "- 模板引擎存在: \`command -v utpl\`(由 \`ucode\` 包提供, firewall4 已依赖它)"
          echo ""
          echo "安装: 把 artifact 内全部 ipk 上传到路由器 /tmp/unm-ipk, 执行 tools/install-unm-on-router.sh"
        } >> $GITHUB_STEP_SUMMARY

