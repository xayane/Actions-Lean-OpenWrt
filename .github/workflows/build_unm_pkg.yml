#=================================================
# 基于 https://github.com/xayane/Actions-Lean-OpenWrt 调整
# 用途: 单独编译 luci-app-unblockneteasemusic(JS 版) 及其运行时依赖 node, 产出 ipk
#
# 插件来源: LEDE luci feed 自带版本(v3.4, nftset + firewall4)。
#   MJ 与 GXT 两台已统一到该版本, 因此只需跑一次:
#     - 插件本体 LUCI_PKGARCH:=all, 与架构无关;
#     - node 的 ipk 两台同架构(x86_64)通用。
#
# lede_commit 必须与对应固件构建使用的 commit 一致, 否则 node 链接的
# libc/libstdc++/openssl 版本可能与固件不匹配, opkg 会报符号缺失。
#=================================================

name: Build UNM ipk (standalone)

on:
  workflow_dispatch:
    inputs:
      lede_commit:
        description: "LEDE commit: 40 位或短哈希均可, 建议填固件构建用的; 留空=分支 HEAD"
        required: false
        default: ""

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: unm/unm.config
  UNM_PKG: luci-app-unblockneteasemusic
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        preinstalled-runtimes: true
        docker-images: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: true

    - name: Install build dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt update
        sudo -E apt -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison \
          build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
          gcc-multilib g++-multilib gettext genisoimage git gperf haveged help2man intltool \
          libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev \
          libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev \
          libreadline-dev libssl-dev libtool llvm lrzsz msmtp ninja-build p7zip p7zip-full \
          patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync \
          scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget \
          xmlto xxd zlib1g-dev
        sudo timedatectl set-timezone "$TZ"
        df -hT

    - name: Clone LEDE
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RAW_COMMIT: ${{ inputs.lede_commit }}
      run: |
        git clone --depth 1 --branch "$REPO_BRANCH" --single-branch "$REPO_URL" openwrt
        cd openwrt

        # 去掉手抖带进来的空格/换行
        RAW="$(printf '%s' "$RAW_COMMIT" | tr -d '[:space:]')"

        if [ -z "$RAW" ]; then
          echo "::warning::lede_commit 未填写, 本次使用 ${REPO_BRANCH} 当前 HEAD"
          echo "::warning::若它与固件构建时的 commit 不同, node 链的 libstdc++/libssl 可能对不上, 路由器上会报符号缺失"
          echo "LEDE_PINNED=no" >> $GITHUB_ENV
        else
          # 只接受 7-40 位十六进制。路由器 /etc/openwrt_release 里
          # DISTRIB_REVISION='r28000-abc1234' 末尾那串短哈希也可以直接填。
          case "$RAW" in
            *[!0-9a-fA-F]*) echo "::error::lede_commit 含非十六进制字符: $RAW"; exit 1 ;;
          esac
          [ "${#RAW}" -ge 7 ] || { echo "::error::lede_commit 太短(${#RAW} 位), 至少 7 位"; exit 1; }

          FULL=""
          if [ "${#RAW}" -eq 40 ]; then
            FULL="$RAW"
          else
            # 注意: GitHub API 不支持用短哈希查 commit(会直接返回 "No commit found for SHA"),
            # 所以在分支历史里按前缀匹配。固件是新近构建的, 最近 500 个 commit 足够覆盖。
            page=1
            while [ "$page" -le 5 ] && [ -z "$FULL" ]; do
              list="$(gh api "repos/coolsnowwolf/lede/commits?sha=${REPO_BRANCH}&per_page=100&page=${page}" --jq '.[].sha' 2>/dev/null || true)"
              for s in $list; do
                case "$s" in
                  "$RAW"*) FULL="$s"; break ;;
                esac
              done
              page=$((page + 1))
            done
            if [ -z "$FULL" ]; then
              echo "::error::在 ${REPO_BRANCH} 最近 500 个 commit 里找不到 $RAW"
              echo "::error::请到固件 workflow 运行页 Summary 复制完整 40 位 commit 再试"
              exit 1
            fi
            echo "短哈希 ${RAW} -> 完整 ${FULL}"
          fi

          # 优先只取这一个 commit; 服务器不允许按 sha 取时逐级加深
          git fetch --depth 1 origin "$FULL" 2>/dev/null \
            || git fetch --depth 500 origin "$REPO_BRANCH" 2>/dev/null \
            || git fetch origin
          git checkout -q "$FULL"
          GOT="$(git rev-parse HEAD)"
          if [ "$GOT" != "$FULL" ]; then
            echo "::error::checkout 后 HEAD($GOT) 与请求的 commit($FULL) 不一致"; exit 1
          fi
          echo "已固定到固件侧 commit: $GOT"
          echo "LEDE_PINNED=yes" >> $GITHUB_ENV
        fi

        echo "LEDE_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV
        echo "SHORT_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        git log -1 --format='LEDE commit: %H%n提交日期: %ci%n标题: %s'

    - name: Update and install feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Check UNM package in feed
      run: |
        cd openwrt
        PKG_DIR="package/feeds/luci/${UNM_PKG}"
        [ -e "$PKG_DIR/Makefile" ] || {
          echo "::error::luci feed 中找不到 ${UNM_PKG}, 请检查 feeds.conf.default 的 luci 分支"
          exit 1
        }
        # feed 版 Makefile 用相对路径 include ../../luci.mk,
        # 因此必须是 feeds 的符号链接形态; 若被替换成真实目录会报找不到 luci.mk
        if [ -L "$PKG_DIR" ]; then
          echo "OK: ${PKG_DIR} 是符号链接(相对 include 可用)"
        else
          echo "::warning::${PKG_DIR} 不是符号链接, 若编译时报找不到 luci.mk 请检查是否被 clone 覆盖"
        fi
        echo "----- 待编译版本 -----"
        grep -E '^(PKG_VERSION|PKG_RELEASE|LUCI_TITLE|LUCI_DEPENDS)' \
          "$PKG_DIR/Makefile" | tee /tmp/unm-meta.txt
        grep -q 'JavaScript' "$PKG_DIR/Makefile" \
          || echo "::warning::标题不含 JavaScript, 可能不是预期的 JS 版插件"
        # 确认分流实现是 fw4 的 nftset 模板(而非旧的 ipset)
        if grep -q 'nftables.ut' "$PKG_DIR/root/etc/init.d/${UNM_PKG#luci-app-}"; then
          echo "分流实现: nftset (fw4)"
        else
          echo "::warning::未在 init.d 中检测到 nftables.ut, 分流路径可能与预期不同"
        fi
        UNM_VER="$(sed -n 's/^PKG_VERSION:=//p' /tmp/unm-meta.txt | head -1)"
        [ -n "$UNM_VER" ] || UNM_VER="unknown"
        echo "UNM_VER=${UNM_VER}" >> $GITHUB_ENV

    - name: Apply config
      run: |
        cd openwrt
        cp "$GITHUB_WORKSPACE/$CONFIG_FILE" .config
        # 仓库里的 unm.config 在 Windows 上编辑过会是 CRLF; kconfig 自己能剥掉 \r,
        # 但这里顺手归一化, 免得后续比较/排查时被行尾差异干扰
        sed -i 's/\r$//' .config
        echo "----- 喂给 defconfig 的关键行 -----"
        grep -E '^CONFIG_(TARGET|PACKAGE_node|PACKAGE_luci-app-unblockneteasemusic)' .config || true
        make defconfig

    - name: Verify configuration
      run: |
        cd openwrt
        echo "########## .config 行数: $(wc -l < .config)"
        echo "########## 生效的 target / arch ##########"
        grep -E '^CONFIG_(TARGET|ARCH|BUILD_)' .config || true
        echo "########## 关键包 ##########"
        grep -E "^CONFIG_PACKAGE_(node|${UNM_PKG}|firewall4|nftables-json|ucode|dnsmasq-full)=" .config || true
        echo "########## node 相关选项 ##########"
        grep -E '^CONFIG_NODEJS' .config || true

        fail=0
        # node 的 ABI 只由 board + subtarget 决定(它们决定 ARCH、工具链、libc/libstdc++/libssl),
        # profile 只影响镜像打包与 DEFAULT_PACKAGES, 单包编译不需要它。
        # 所以硬断言只落在 board/subtarget 上。
        grep -qE '^CONFIG_TARGET_x86=y' .config \
          || { echo "::error::board 未选中: CONFIG_TARGET_x86 缺失"; fail=1; }
        grep -qE '^CONFIG_TARGET_x86_64=y' .config \
          || { echo "::error::subtarget 未选中: CONFIG_TARGET_x86_64 缺失"; fail=1; }

        # profile 的符号名随源码版本变过:
        #   旧版 target/linux/x86/64/target.mk 有 `define Profile/Generic` -> CONFIG_TARGET_x86_64_Generic
        #   新版只剩 image/64.mk 的 `define Device/generic` + TARGET_DEVICES -> CONFIG_TARGET_x86_64_DEVICE_generic
        # 当前 LEDE master 的 target.mk 里已经没有 Profile/Generic, 所以只断言 Generic 必然失败。
        # 这里按"三选一命中即可, 但一个 profile 都没有就真错了"来判。
        if grep -qE '^CONFIG_TARGET_x86_64_(Generic|DEVICE_generic)=y' .config; then
          echo "OK: x86_64 的 Generic profile 已选中"
        elif grep -qE '^CONFIG_TARGET_x86_64_[A-Za-z0-9_]+=y' .config; then
          echo "::warning::profile 符号与预期不同, 实际为:"
          grep -E '^CONFIG_TARGET_x86_64_[A-Za-z0-9_]+=y' .config | head -5
        else
          echo "::error::x86_64 下没有任何 profile 被选中, defconfig 可能把 target 整体丢了"
          fail=1
        fi

        for sym in "PACKAGE_${UNM_PKG}" PACKAGE_node PACKAGE_firewall4; do
          grep -qE "^CONFIG_${sym}=y" .config || { echo "::error::${sym} 未选中"; fail=1; }
        done

        [ $fail -eq 0 ] || exit 1
        echo "OK: 配置校验通过(board/subtarget 与关键包均已就位)"

    # 目标名说明(2026-11-09 查证, 修正前两轮的误判):
    #   package/<源码目录>/compile 与 package/<包目录名>/compile(include/subdir.mk 的
    #   diralias 别名, 如 package/node/compile) 都能用, 第六次运行的日志已经证明后者会
    #   正常展开 node 的依赖闭包。报错里出现的 include/toplevel.mk:231 并不是"目标不存在",
    #   它只是 `%::` 规则里被委派的 recipe 行 —— OpenWrt 所有目标都走这条规则进子 make。
    #
    #   真正的问题是: 子 make 的图里同时排进了 package/kernel/linux/compile, 而内核从没编过,
    #   于是报 linux-6.x.y/.config 打不开、mdio_devres.ko 缺失。见下方 "Build kernel" 步骤。
    #
    #   目标名的正确拼法(2026-11-09 第七次运行日志证实, 此前拼错导致 package/package/...):
    #   include/scan.mk 第 9 行 `SCAN_DIR ?= package`, 第 50 行 `echo Source-Makefile: $(SCAN_DIR)/$(2)/Makefile`
    #   —— 也就是说 tmp/.packageinfo 里的 Source-Makefile **本身就是 `package/<相对目录>/Makefile`**,
    #   已经带了 package/ 前缀。再拼一次 "package/" 就变成 package/package/..., 子 make 直接
    #   报 `No rule to make target`。正确做法是先把前缀剥掉, 得到相对目录, 再拼一次。
    #
    #   相对目录的权威来源是 tmp/.packagedeps 的 `package-y += <相对目录>`(scripts/package-metadata.pl:476)
    #   与 `$(curdir)/<相对目录>/compile += ...`(:542), 这两处的路径都不带 package/ 前缀,
    #   正好和 include/subdir.mk 生成目标 `$(curdir)/$(bd)/compile` 的语义对齐。
    - name: Resolve package build targets
      run: |
        cd openwrt

        # 注意: tmp/.packageinfo 里 Source-Makefile 排在 Package: 之前, 必须先缓存再匹配
        # 返回的是 repo 根相对路径, 形如 package/feeds/packages/node
        resolve_src() {
          awk -v want="$1" '
            /^Source-Makefile: / { p = $2; sub(/\/Makefile$/, "", p) }
            /^Package: / && $2 == want { print p; exit }
          ' tmp/.packageinfo
        }

        # 剥掉开头的 package/, 得到相对 package/ 的目录名(与 .packagedeps 里的写法一致)
        strip_prefix() {
          case "$1" in
            package/*) printf '%s\n' "${1#package/}" ;;
            *)         printf '%s\n' "$1" ;;
          esac
        }

        # 已注册的 builddir 集合: package-y/package- 右侧, 以及 $(curdir)/xxx/compile 左侧
        if [ -f tmp/.packagedeps ]; then
          # 两种写法都要归一化成"无前导斜杠的相对目录"
          #   package-y += feeds/packages/node
          #   $(curdir)/feeds/packages/node/compile += ...
          sed -n -e 's/^package-[ym]* += //p' -e 's/^\$(curdir)\(.*\)\/compile += .*/\1/p' \
            -e 's/^\$(curdir)\(.*\)\/compile:.*/\1/p' tmp/.packagedeps \
            | tr ' ' '\n' | sed -e 's|^/||' -e '/^$/d' | sort -u > /tmp/registered-dirs.txt
          echo "tmp/.packagedeps 里已注册的 builddir: $(wc -l < /tmp/registered-dirs.txt) 个"
        else
          : > /tmp/registered-dirs.txt
          echo "::warning::tmp/.packagedeps 不存在, 跳过 builddir 注册性校验"
        fi

        fail=0
        for name in node "$UNM_PKG"; do
          src="$(resolve_src "$name")"
          if [ -z "$src" ]; then
            echo "::error::${name} 在 tmp/.packageinfo 里查不到源码目录, 该包可能没被 feeds install 进来"
            fail=1
            continue
          fi
          rel="$(strip_prefix "$src")"
          if [ ! -f "package/${rel}/Makefile" ]; then
            echo "::error::${name} 的源码目录 package/${rel} 下没有 Makefile"
            fail=1
            continue
          fi
          echo "${name}: Source-Makefile=${src} -> 相对目录 ${rel}  (PKG_VERSION=$(sed -n 's/^PKG_VERSION:=//p' "package/${rel}/Makefile" | head -1))"
        done
        [ $fail -eq 0 ] || exit 1

        # 拼目标并在 .packagedeps 里核对是否真的注册了
        # 注意: 本函数用 $( ) 捕获返回值, 所有诊断信息必须走 stderr, 否则会污染目标名
        make_goal() {
          local name="$1" rel goal
          rel="$(strip_prefix "$(resolve_src "$name")")"
          goal="package/${rel}/compile"
          if [ -s /tmp/registered-dirs.txt ] && ! grep -qxF "$rel" /tmp/registered-dirs.txt; then
            {
              echo "::warning::${rel} 不在 tmp/.packagedeps 的 builddir 列表里, 目标 ${goal} 可能不被识别"
              echo "           同名候选: $(grep -F "/$(basename "$rel")" /tmp/registered-dirs.txt | head -5 | tr '\n' ' ')"
            } >&2
          fi
          printf '%s\n' "$goal"
        }

        NODE_GOAL="$(make_goal node)"
        UNM_GOAL="$(make_goal "$UNM_PKG")"
        # 双 package/ 前缀是最容易犯的错, 出现就立即失败, 不要等到 40 分钟后再报
        case "$NODE_GOAL$UNM_GOAL" in
          *package/package/*)
            echo "::error::目标名出现重复的 package/ 前缀: $NODE_GOAL / $UNM_GOAL"
            exit 1
            ;;
        esac
        echo "NODE_GOAL=$NODE_GOAL" >> $GITHUB_ENV
        echo "UNM_GOAL=$UNM_GOAL" >> $GITHUB_ENV
        echo "node -> $NODE_GOAL"
        echo "unm  -> $UNM_GOAL"

        # 备用目标: include/subdir.mk 的 diralias 会为每个 builddir 额外注册
        # package/<目录名>/compile(如 package/node/compile)。第六次运行的日志已证明这种写法可用,
        # 只是在同名目录冲突时会指向不确定的那个, 所以只作为主目标失败后的兜底。
        NODE_REL="$(strip_prefix "$(resolve_src node)")"
        UNM_REL="$(strip_prefix "$(resolve_src "$UNM_PKG")")"
        echo "NODE_GOAL_ALT=package/$(basename "$NODE_REL")/compile" >> $GITHUB_ENV
        echo "UNM_GOAL_ALT=package/$(basename "$UNM_REL")/compile" >> $GITHUB_ENV
        echo "node 备用 -> package/$(basename "$NODE_REL")/compile"
        echo "unm  备用 -> package/$(basename "$UNM_REL")/compile"

        # 诊断: 把 node 的编译依赖列表打出来, 并标出有没有 kernel/linux。
        # tmp/.packagedeps 是 makefile 片段, 路径写成字面量 $(curdir)/<相对目录>/compile
        if [ -f tmp/.packagedeps ]; then
          DEPS="$(grep -F "\$(curdir)/${NODE_REL}/compile" tmp/.packagedeps | head -1 || true)"
          DEPS="${DEPS#*= }"   # 去掉 "目标 +=" 前缀, 只留右侧依赖
          echo "--- node 的编译依赖(tmp/.packagedeps) ---"
          echo "$DEPS" | tr ' ' '\n' | grep -F '$(curdir)/' \
            | sed 's|.*\$(curdir)/||; s|/compile$||' | sed 's/^/  /' | head -30 || true
          if echo "$DEPS" | grep -q 'kernel/linux'; then
            echo "=> 依赖里含 kernel/linux: 必须先编内核, 否则 kmod 打包会失败"
          else
            echo "=> 依赖里没有 kernel/linux: 内核步骤属预防性构建"
          fi
        fi

    - name: Build tools and toolchain
      run: |
        cd openwrt
        make tools/install -j$(nproc) || make tools/install -j1
        make toolchain/install -j$(nproc) || make toolchain/install -j1

    # 为什么必须先编内核(2026-11-09 第六次运行日志证实):
    #   编译 node 的目标图里包含 package/kernel/linux/compile —— 这个源包负责把内核
    #   build_dir 里的 *.ko 打成 kmod-*.ipk。内核没编过时, 它连
    #   build_dir/target-*/linux-*/linux-x.y.z/.config 都打不开, 随即报
    #   "module '.../mdio_devres.ko' is missing" 并让整步失败。
    #
    #   这不是配置缺符号, 而是构建顺序问题: 根 Makefile 里写着
    #       $(package/stamp-compile): $(target/stamp-compile)
    #   即"包在 target 之后"。`make world` 会自动保证这一点, 单独编某个包则不会,
    #   必须手动先把 target/linux 编出来。
    #
    #   代价: 2 核 runner 上约 20-30 分钟。不编内核就没有 .ko, kmod 打包必然失败,
    #   没有任何配置能绕过这一环。
    - name: Build kernel for target
      run: |
        cd openwrt
        echo "开始编译内核(为 kmod 打包提供 .ko), 预计 20-30 分钟"
        START=$(date +%s)
        make target/linux/compile -j$(nproc) V=s > /tmp/kernel-build.log 2>&1 \
          || make target/linux/compile -j1 V=s >> /tmp/kernel-build.log 2>&1 \
          || {
            echo "::error::内核编译失败, 尾部错误行:"
            grep -nE 'Error [0-9]+|\*\*\*|error:' /tmp/kernel-build.log | tail -5 \
              | while IFS= read -r line; do echo "::error::${line:0:900}"; done
            tail -40 /tmp/kernel-build.log
            exit 1
          }
        echo "内核编译耗时: $(( $(date +%s) - START )) 秒"

        # 自证: 内核配置与 modules.builtin 必须存在, 否则 kmod 打包一定失败
        KBUILD_DIR=$(ls -d build_dir/target-*/linux-*/linux-[0-9]* 2>/dev/null | head -1)
        echo "内核源码目录: ${KBUILD_DIR:-<未找到>}"
        if [ -z "$KBUILD_DIR" ] || [ ! -f "$KBUILD_DIR/.config" ]; then
          echo "::error::内核 .config 未生成, 后续 kmod 打包必然失败"
          exit 1
        fi
        echo "OK: 内核已就绪, .ko 数量 = $(find "$KBUILD_DIR" -name '*.ko' | wc -l)"

    # 失败时把决定性错误行以 ::error:: 注解发出。
    # 注解接口是公开可读的, 而 job 日志要仓库权限才能下载(403 Must have admin rights),
    # 这样即使拿不到日志也能定位; 注解每步上限 10 条、单条约 64KB, 只取尾部 5 行。
    - name: Compile node runtime
      run: |
        cd openwrt
        # runner 实际用的是 `/usr/bin/bash -e {0}`(日志可查), 默认**没有** pipefail,
        # 于是 `make | tee` 的 $? 是 tee 的 0, make 失败会被吞掉 —— 第七次运行就是这样:
        # 本步报 Error 2 却仍继续执行, 一直到 Collect ipk 才以 "bin/packages 不存在" 失败。
        set -o pipefail
        LOG=/tmp/node-build.log
        GOAL="$NODE_GOAL"
        echo "目标: $GOAL"
        set +e
        make "$GOAL" V=s -j$(nproc) 2>&1 | tee "$LOG"
        rc=$?
        # 主目标若未被 make 识别, 自动退到 include/subdir.mk 的目录别名目标再试一次
        if [ $rc -ne 0 ] && grep -qF 'No rule to make target' "$LOG"; then
          echo "::warning::主目标 $GOAL 未被识别, 改用目录别名目标 ${NODE_GOAL_ALT}"
          GOAL="$NODE_GOAL_ALT"
          make "$GOAL" V=s -j$(nproc) 2>&1 | tee "$LOG"
          rc=$?
        fi
        if [ $rc -ne 0 ]; then
          echo "::warning::并行编译失败(rc=$rc), 改用 -j1 重试以取得确定的错误位置"
          make "$GOAL" V=s -j1 2>&1 | tee -a "$LOG"
          rc=$?
        fi
        set -e
        if [ $rc -ne 0 ]; then
          echo "::error::node 编译失败 (rc=$rc), 目标 $GOAL"
          grep -nE 'No rule to make target|toplevel\.mk:[0-9]+|is missing|failed to build|Error [0-9]+|\*\*\*' "$LOG" \
            | tail -5 | while IFS= read -r line; do
                echo "::error::${line:0:900}"
              done
          exit 1
        fi

    - name: Compile luci-app-unblockneteasemusic
      run: |
        cd openwrt
        set -o pipefail
        LOG=/tmp/unm-build.log
        GOAL="$UNM_GOAL"
        echo "目标: $GOAL"
        set +e
        make "$GOAL" V=s -j$(nproc) 2>&1 | tee "$LOG"
        rc=$?
        if [ $rc -ne 0 ] && grep -qF 'No rule to make target' "$LOG"; then
          echo "::warning::主目标 $GOAL 未被识别, 改用目录别名目标 ${UNM_GOAL_ALT}"
          GOAL="$UNM_GOAL_ALT"
          make "$GOAL" V=s -j$(nproc) 2>&1 | tee "$LOG"
          rc=$?
        fi
        if [ $rc -ne 0 ]; then
          echo "::warning::并行编译失败(rc=$rc), 改用 -j1 重试"
          make "$GOAL" V=s -j1 2>&1 | tee -a "$LOG"
          rc=$?
        fi
        set -e
        if [ $rc -ne 0 ]; then
          echo "::error::${UNM_PKG} 编译失败 (rc=$rc), 目标 $GOAL"
          grep -nE 'No rule to make target|toplevel\.mk:[0-9]+|is missing|failed to build|Error [0-9]+|\*\*\*' "$LOG" \
            | tail -5 | while IFS= read -r line; do
                echo "::error::${line:0:900}"
              done
          exit 1
        fi

    - name: Collect ipk and inspect control data
      run: |
        cd openwrt
        if [ ! -d bin/packages ]; then
          echo "::error::bin/packages 不存在, 说明前面的编译步骤没有产出任何 ipk"
          echo "--- bin/ 下的实际内容 ---"
          ls -la bin 2>/dev/null || echo "(bin/ 也不存在)"
          echo "--- 各包 stamp 状态 ---"
          ls -la build_dir/target-*/stamp 2>/dev/null | head -20 || echo "(无 stamp 目录)"
          exit 1
        fi
        mkdir -p out
        found=$(find bin/packages -name '*.ipk' | wc -l)
        echo "找到 ipk: ${found} 个"
        if [ "$found" -eq 0 ]; then
          echo "::error::bin/packages 下没有任何 .ipk"
          find bin/packages -maxdepth 4 -type d | head -20
          exit 1
        fi
        find bin/packages -name '*.ipk' -exec cp -f {} out/ \;
        cd out
        ls -lh
        echo "=========== 各包 Depends ==========="
        for f in *.ipk; do
          echo "=== $f"
          ar p "$f" control.tar.gz 2>/dev/null | tar -xzO ./control 2>/dev/null | sed -n '1,15p' || echo "(无法解析)"
        done
        sha256sum *.ipk > SHA256SUMS
        du -sh .

    - name: Upload ipk artifact
      uses: actions/upload-artifact@v4
      with:
        name: unm-ipk-v${{ env.UNM_VER }}-${{ env.SHORT_COMMIT }}
        path: |
          openwrt/out
          openwrt/bin/packages/x86_64
        if-no-files-found: error

    - name: Write build summary
      run: |
        {
          echo "## UNM ipk 构建完成(MJ / GXT 通用)"
          echo ""
          echo "- 插件版本: \`v${UNM_VER}\`(LEDE luci feed, JS 版)"
          echo "- 分流机制: nftset + firewall4"
          if [ "${LEDE_PINNED}" = "yes" ]; then
            echo "- LEDE commit: \`${LEDE_COMMIT}\`(已按输入固定)"
          else
            echo "- LEDE commit: \`${LEDE_COMMIT}\` **未固定**, 用的是分支 HEAD"
            echo ""
            echo "> 若与固件构建时的 commit 不同, node 的运行时依赖可能对不上。"
            echo "> 请带 \`lede_commit\` 重跑一次, 值取固件 workflow 运行页 Summary 里的那串。"
          fi
          echo ""
          echo "插件本体为 \`PKGARCH:=all\`,node 为 x86_64;两台路由器同一份 ipk 通用。"
          echo ""
          echo "安装前确认路由器侧:"
          echo "- \`fw4\` 在跑: \`fw4 -v\` 或 \`nft list ruleset | head\`"
          echo "- 模板引擎存在: \`command -v utpl\`(由 \`ucode\` 包提供, firewall4 已依赖它)"
          echo ""
          echo "安装: 把 artifact 内全部 ipk 上传到路由器 /tmp/unm-ipk, 执行 tools/install-unm-on-router.sh"
        } >> $GITHUB_STEP_SUMMARY
